# PostgreSQL 16 with pgvector for taxground. Start it, then:
#   DB="postgresql://grounding:grounding@localhost:5433/taxground" ./build_all.sh
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grounding
      POSTGRES_PASSWORD: grounding
      POSTGRES_DB: taxground
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
