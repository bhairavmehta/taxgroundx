<style>
/* Layout: sticky app bar, summary band, tab strip; Buckets = hierarchy rail + detail; a report reader slides in from the right. */
:root{
  --bg:#eef2f5; --panel:#fbfcfd; --sunk:#e4eaef; --ink:#14202c; --body:#3e4c5a; --muted:#5b6977; --line:#d0d9e1;

  --ok:#1f5fb4; --ok-soft:#dde7f8; --rev:#8a5200; --rev-soft:#f6e7cc; --bad:#a3342a; --bad-soft:#f5dcd8; --mer:#5a4fa0; --mer-soft:#e6e3f5;
  --mark:#ffe7a3;
  --c1:#2a62c9; --c2:#e39b2d; --c3:#1f9d7a; --c4:#c2410c; --c5:#7c4dbe; --c6:#0e8fb0; --c7:#c23a6b; --c8:#6b8e23;
  --pl:92%; --pt:28%; --ps:70%;

  --f-head:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif; --f-body:'IBM Plex Sans',system-ui,Arial,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --night:#08111a; --night-ink:#e9eff4; --night-body:#b5c3cf;
  --accent:#7fb0f0; --accent-soft:#1b3150; --amber:#f0b357; --amber-strong:#e39b2d; --amber-soft:#3a2a10;
  --ok:#86b6f2; --ok-soft:#18304f; --rev:#f0b357; --rev-soft:#3a2a10; --bad:#f08f84; --bad-soft:#42201d; --mer:#b4abf0; --mer-soft:#2a2650;
  --c1:#7fb0f0; --c2:#f0b357; --c3:#4fd1a8; --c4:#f2865a; --c5:#b79cf2; --c6:#5cc8e6; --c7:#f07ba6; --c8:#a9c95a;
  --pl:22%; --pt:82%; --ps:45%;
  --hl-ev:#6b5210; --hl-pc:#1d3558; --hl-cause:#4d2420; --hl-factor:#4a3214; --hl-find:#33285a; --hl-rel:#163d30; --hl-kw:#5fe0b4;
  --mark:#5b4712; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c151e; --panel:#131f2b; --sunk:#192836; --ink:#e6edf3; --body:#b9c6d2; --muted:#93a3b3; --line:#283849;
  --night:#08111a; --night-ink:#e9eff4; --night-body:#b5c3cf;
  --accent:#7fb0f0; --accent-soft:#1b3150; --amber:#f0b357; --amber-strong:#e39b2d; --amber-soft:#3a2a10;
  --ok:#86b6f2; --ok-soft:#18304f; --rev:#f0b357; --rev-soft:#3a2a10; --bad:#f08f84; --bad-soft:#42201d; --mer:#b4abf0; --mer-soft:#2a2650;
  --c1:#7fb0f0; --c2:#f0b357; --c3:#4fd1a8; --c4:#f2865a; --c5:#b79cf2; --c6:#5cc8e6; --c7:#f07ba6; --c8:#a9c95a;
  --pl:22%; --pt:82%; --ps:45%;
  --hl-ev:#6b5210; --hl-pc:#1d3558; --hl-cause:#4d2420; --hl-factor:#4a3214; --hl-find:#33285a; --hl-rel:#163d30; --hl-kw:#5fe0b4;
  --mark:#5b4712; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:.2px}
h2{font-size:26px;font-weight:600} h3{font-size:18px;font-weight:600}
.mono{font-family:var(--f-mono);font-size:12.5px}
.lbl{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .body{color:var(--body)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* app bar */
.bar{background:var(--night);color:var(--night-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:#f0b357}
.brand h1{font-size:26px;font-weight:600;color:var(--night-ink)}
.runmeta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--night-body)}
.runmeta b{color:var(--night-ink);font-weight:500}
@media (max-width:900px){.bar{position:static}}
.chunk{font-family:var(--f-mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.chunk.findings{border-color:var(--amber-strong);color:var(--amber)} .chunk.summary{border-color:var(--accent);color:var(--accent)}
.lights{height:4px;background:repeating-linear-gradient(90deg,#e39b2d 0 26px,transparent 26px 60px)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--night-body);font-weight:600;font-size:14px;padding:10px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--night-ink);border-bottom-color:#e39b2d}
nav.tabs button:hover{color:var(--night-ink)}
main{padding-block:22px 64px}
section[data-tab]{display:flex;flex-direction:column;gap:18px}
/* summary band */
.band{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.band>div{flex:1 1 150px;background:var(--panel);padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.band .v{font-family:var(--f-head);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--body)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ms{position:relative}
.ms summary{list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:9px 34px 9px 12px;background:var(--panel);color:var(--ink);font:inherit;position:relative;min-height:40px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms summary::-webkit-details-marker{display:none}
.ms summary::after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.ms summary.on{border-color:var(--amber-strong);font-weight:600}
.ms .msp{position:absolute;z-index:30;left:0;top:calc(100% + 4px);width:max(100%,280px);max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px;display:flex;flex-direction:column;gap:8px}
.ms .msl{max-height:300px;overflow:auto;display:flex;flex-direction:column}
.ms .msi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:400;color:var(--ink)}
.ms .msi:hover{background:var(--sunk)}
.ms .msb{justify-content:space-between}
.lblf{font-size:12.5px;font-weight:600;color:var(--body)}
@media (max-width:720px){.ms .msp{position:fixed;left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));top:auto;bottom:calc(16px + env(safe-area-inset-bottom, 0px));width:auto;max-width:none}.ms .msl{max-height:55vh}}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}
@media (max-width:980px){.grid3,.grid4,.grid5{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:900px){.stick{position:static}}
@media (max-width:720px){.grid2,.grid3,.grid4,.grid5{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-grounded{background:var(--ok-soft);color:var(--ok)} .s-needs_review{background:var(--rev-soft);color:var(--rev)}
.s-not_grounded{background:var(--bad-soft);color:var(--bad)} .s-merged,.s-abstain{background:var(--mer-soft);color:var(--mer)}
.c-pass{color:var(--ok)} .c-review{color:var(--rev)} .c-block{color:var(--bad)}
.code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:4px;padding:0 6px;white-space:nowrap}
.req{display:flex;flex-direction:column;gap:8px}
.req .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
/* buckets */
.bench{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);max-height:calc(100vh - 140px)}
@media (max-width:900px){.rail{position:static;max-height:420px}}
.rail .tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
input[type=search],input[type=text],input[type=number],select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.list{overflow:auto;padding:6px}
.grp{padding:10px 8px 4px;display:flex;justify-content:space-between;gap:8px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;padding:8px;border-radius:7px}
.item:hover{background:var(--sunk)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .id{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.item .nm{font-size:13.5px;line-height:1.3}
.dot{width:9px;height:9px;border-radius:50%}
.d-grounded{background:var(--ok)} .d-needs_review{background:var(--amber-strong)} .d-not_grounded{background:var(--bad)} .d-merged,.d-abstain{background:var(--mer)}
.detail{display:flex;flex-direction:column;gap:18px;min-width:0}
.dhead{display:flex;flex-direction:column;gap:8px}
.dhead h2{font-size:34px;line-height:1.1}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
/* chain */
.chain{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,.8fr) minmax(0,1.2fr) minmax(0,1.6fr);gap:12px}
@media (max-width:1100px){.chain{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:620px){.chain{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col>.lbl{display:flex;gap:6px;align-items:center}
.node{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px;min-width:0}
.node.dark{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.node.dark .muted{color:var(--night-body)}
.node.parent{border:2px solid var(--accent)}
.node .t{font-weight:600;font-size:14px;line-height:1.3}
.node.rep{cursor:pointer}
.node.rep:hover{border-color:var(--accent)}
.q{font-size:13.5px;line-height:1.45;color:var(--body)}
.scroll{max-height:560px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:72px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13px}
.track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent)}
.fill.win{background:var(--amber-strong)}
.num{font-variant-numeric:tabular-nums;text-align:right}
/* checks */
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:13.5px;padding:7px 9px;border-radius:7px;background:var(--sunk)}
.chk b{font-family:var(--f-mono);font-size:12.5px}
/* criteria */
ul.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.crit li{display:flex;flex-direction:column;gap:4px;padding-left:12px;border-left:3px solid var(--line)}
ul.crit.inc li{border-left-color:var(--accent)} ul.crit.exc li{border-left-color:var(--amber-strong)}
.cite{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;color:var(--accent);align-self:flex-start}
.cite[disabled]{cursor:default;color:var(--muted)}
blockquote{margin:0;padding:6px 10px;background:var(--sunk);border-radius:5px;font-size:13.5px;line-height:1.45}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:var(--sunk);font-weight:600;position:sticky;top:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.matrix td.cell{text-align:center;font-family:var(--f-mono);font-size:12px;font-weight:500}
.cell.pass{color:var(--ok)} .cell.review{background:var(--rev-soft);color:var(--rev)} .cell.block{background:var(--bad-soft);color:var(--bad)}
/* buttons */
.btn{border:0;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--panel)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--body)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:13px}
.note{font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
/* reader */
.scrim{position:fixed;inset:0;background:rgba(5,10,16,.45);z-index:20}
.reader{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;
  border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.reader header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.reader .rb{overflow:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:14px}
.reader .narr{font-size:15px;line-height:1.65;white-space:pre-wrap}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
dl.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:13.5px}
dl.meta dt{color:var(--muted)} dl.meta dd{margin:0}
.steps{display:flex;flex-direction:column;gap:14px}
.step{border-left:3px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:8px}
.step.on{border-left-color:var(--amber-strong)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
/* colour per CICTT parent; click a chip to filter by it */
.code.p{background:hsl(var(--h) var(--ps) var(--pl));color:hsl(var(--h) 65% var(--pt));cursor:pointer;font-weight:500}
.code.p:hover{outline:1px solid hsl(var(--h) 60% 50%)}
.code.p.on{outline:2px solid hsl(var(--h) 70% 45%)}
/* global filter bar */
.gf{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end;
  border-top:4px solid transparent;border-image:linear-gradient(90deg,var(--c1),var(--c3),var(--c2),var(--c7)) 1;border-image-slice:1}
.gf .sum{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--body)}
.gf .sum b{color:var(--ink)}
.gf .tag{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 4px 1px 10px;font-size:12px;font-weight:600}
.gf .tag button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px}
.gf .tag button:hover{background:var(--panel)}
@media (max-width:1100px){.gf{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:640px){.gf{grid-template-columns:minmax(0,1fr)}}
.ms .msall{border-bottom:1px solid var(--line);padding-bottom:6px;font-weight:600}
/* reader highlights */
.hl-legend{display:flex;flex-wrap:wrap;gap:6px}
.hl-legend label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 6px;cursor:pointer;background:var(--panel)}
.hl-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.narr .s{border-radius:3px;padding:1px 0;transition:background .15s}
.narr.show-ev .s.ev{background:var(--hl-ev);box-shadow:0 0 0 2px var(--hl-ev)}
.narr.show-pc .s.pc{background:var(--hl-pc)}
.narr.show-cause .s.cause{background:var(--hl-cause)}
.narr.show-factor .s.factor{background:var(--hl-factor)}
.narr.show-find .s.find{background:var(--hl-find)}
.narr.show-rel .s.rel{background:var(--hl-rel)}
.narr.show-kw .kw{color:var(--hl-kw);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.relbar{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--sunk);vertical-align:middle;margin-left:6px;overflow:hidden}
.relbar span{display:block;height:100%;background:var(--c3)}
/* colourful KPI tiles */
.band>div{border-top:3px solid var(--tc,var(--line))}
.band>div:nth-child(1){--tc:var(--c1)} .band>div:nth-child(2){--tc:var(--c3)} .band>div:nth-child(3){--tc:var(--c2)} .band>div:nth-child(4){--tc:var(--c5)} .band>div:nth-child(5){--tc:var(--c7)}
.band .v{color:var(--tc)}
.panel.accent{border-left:4px solid var(--c1)}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:11px var(--f-body);fill:var(--muted)}

.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
.toc{display:flex;flex-wrap:wrap;gap:6px}

.tip{position:fixed;z-index:40;pointer-events:none;background:var(--night);color:var(--night-ink);font-size:12px;padding:6px 9px;border-radius:6px;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:8px;padding:10px 14px;line-height:1.6;overflow-x:auto;white-space:pre}
.chunkcard{border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.chunkcard .hdr{font-family:var(--f-mono);font-size:11.5px;color:var(--kc);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LABEL = {grounded:'Grounded', needs_review:'Needs review', not_grounded:'Not grounded', merged:'Merged', abstain:'Abstained'};
const OUTCOME = {release_candidate:'Release candidate', sme_review:'SME review', sme_review_agent:'SME review (agent)', escalated_to_sme:'Escalated to SME',
                 returned_to_discovery:'Returned to discovery', abstained:'Abstained', merged:'Merged before grounding'};
const COLORS = {grounded:'var(--ok)', needs_review:'var(--amber-strong)', not_grounded:'var(--bad)', merged:'var(--mer)', abstain:'var(--mer)'};
const pill = s => `<span class="pill s-${s}">${LABEL[s] || s}</span>`;
let D = null, P = {}, DEF = {}, B = {}, current = null, corpus = null, corpusLoading = null;
const ui = {status: 'all', q: ''};

/* ---------------------------------------------------------------- boot */
/* Data is packed into the page (gzip + base64) by tools/pack_viewer.py, so the page needs no network;
   without a packed block it falls back to fetching data/*.json from beside the page. */
async function packed(id) {
  const el = document.getElementById(id); if (!el) return null;
  const bin = atob(el.textContent.trim()), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const stream = new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).json();
}
const getJSON = async (id, url) => (await packed(id)) ?? fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
Promise.all([getJSON('pk-run', 'data/run.json'), getJSON('pk-techniques', 'data/techniques.json').catch(() => null)]).then(([d, tech]) => {
  D = d; D.tech = tech; d.parents.forEach(p => P[p.code] = p); d.definitions.forEach(x => DEF[x.id] = x); d.buckets.forEach(b => B[b.id] = b);
  $('#loading').remove();
  Object.values(D.reports).forEach(r => { r.mk = normMake(r.make); r.ty = typeRoot(r.model); });
  renderMeta(); renderGF(); $('#gf').hidden = false; renderOverview(); renderBuckets(); renderMatrix(); renderParents(); renderGuards(); renderReports(); renderTry(); renderTech(); renderMethod();
  route();
  setTimeout(loadCorpus, 50);
}).catch(e => { $('#loading').innerHTML = `The run data could not be loaded (${esc(e.message)}). Open this page from the published viewer or a local web server, not as a file.`; });

window.addEventListener('hashchange', route);
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) location.hash = b.dataset.tab; });
function route() {
  if (!D) return;
  let h = location.hash.slice(1) || 'overview';
  if (h.startsWith('bucket-')) { const id = h.slice(7); if (B[id]) { current = id; h = 'buckets'; } }
  if (!$(`section[data-tab="${h}"]`)) h = 'overview';
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === h));
  $$('section[data-tab]').forEach(s => s.hidden = s.dataset.tab !== h);
  $('#gf').hidden = h === 'techniques' || h === 'method';
  if (h === 'buckets') showBucket(current || firstBucket());
  if (h === 'reports' || h === 'try') loadCorpus();
}

function renderMeta() {
  const s = D.summary;
  $('#runmeta').innerHTML = `<span>Run <b class="mono">${esc(s.run_id)}</b></span><span>Taxonomy <b class="mono">${esc(s.taxonomy_version)}</b></span>
    <span>Embedder <b>${esc(s.embedder)}</b></span><span>Min support <b>${D.settings.min_support} events</b></span><span>Hash <b class="mono">${esc(s.output_hash.slice(0,12))}</b></span>`;
}

/* ---------------------------------------------------------------- overview */
function counts(list) {
  const c = {grounded:0, needs_review:0, not_grounded:0, merged:0, abstain:0};
  (list || D.buckets).forEach(b => c[b.status]++); return c;
}
function renderOverview() {
  const s = D.summary, BS = D.buckets.filter(bucketOk), c = counts(BS), live = BS.filter(b => b.status !== 'merged');
  const links = live.reduce((n, b) => n + (b.parent ? 1 + b.defs.length + b.support.length : 0), 0);
  const carded = live.filter(b => b.checks.some(k => k.id === 'G9' && k.passed)).length;
  const total = BS.length || 1;
  const stack = ['grounded','needs_review','not_grounded','merged'].map(k => `<span style="width:${100*c[k]/total}%;background:${COLORS[k]}" title="${LABEL[k]} ${c[k]}"></span>`).join('');
  const byParent = {};
  live.forEach(b => { if (b.parent) (byParent[b.parent] = byParent[b.parent] || []).push(b); });
  const rc = {}; let nrep = D.corpus.total;
  if (corpus && anyFilter()) { const rows = corpus.rows.filter(reportOk); nrep = rows.length; rows.forEach(r => r.codes.forEach(k => rc[k] = (rc[k] || 0) + 1)); }
  else D.parents.forEach(p => rc[p.code] = p.reports || 0);
  const topCodes = Object.entries(rc).filter(([, n]) => n).sort((a, b) => b[1] - a[1]).slice(0, 18).map(([code, reports]) => ({code, reports}));
  const max = topCodes[0]?.reports || 1;
  const yr = {}; if (corpus) (anyFilter() ? corpus.rows.filter(reportOk) : corpus.rows).forEach(r => { const y = r.date.slice(0, 4); yr[y] = (yr[y] || 0) + 1; });
  const g = D.guardrails, gb = g.filter(x => x.blocked === 'True' || x.blocked === true).length;
  $('section[data-tab="overview"]').innerHTML = `
  <div class="panel">
    <header><h2>${nrep.toLocaleString()} NTSB reports, ${BS.length} discovery candidates${anyFilter() ? ' <span class="pill s-needs_review">filtered</span>' : ''}</h2><span class="note">${esc(D.note || '')}</span></header>
    <div class="stack" role="img" aria-label="Outcome of ${BS.length} candidates">${stack}</div>
    <div class="legend">${['grounded','needs_review','not_grounded','merged'].map(k => `<span data-sf="${k}" style="cursor:pointer" title="Filter by ${LABEL[k]}"><i style="background:${COLORS[k]}"></i><b>${c[k]}</b> ${LABEL[k].toLowerCase()}</span>`).join('')}</div>
  </div>
  <div class="band">
    <div><span class="lbl">${anyFilter() ? 'Reports matching' : 'Reports indexed'}</span><span class="v">${nrep.toLocaleString()}</span><span class="note">${Object.entries(s.routing||{}).map(([k,v])=>`${v.toLocaleString()} ${k}`).join(' · ')}</span></div>
    <div><span class="lbl">Live buckets</span><span class="v">${live.length}</span><span class="note">${c.merged} merged into a twin first</span></div>
    <div><span class="lbl">Links stored</span><span class="v">${links}</span><span class="note">one SSSOM-style row each</span></div>
    <div><span class="lbl">Criteria cards</span><span class="v">${carded} / ${live.length}</span><span class="note">pass G9</span></div>
    <div><span class="lbl">Faults blocked</span><span class="v">${gb} / ${g.length}</span><span class="note">guardrail tests</span></div>
  </div>
  <div class="grid4">
    ${[['SRS-TAX-01','Trace every bucket',`${live.filter(b=>b.parent).length} buckets linked to one CICTT parent, crosswalked definitions and NTSB reports quoted word for word.`],
       ['SRS-TAX-02','Bounded, re-runnable',`One command from recorded inputs; closed sets; agent capped at ${D.settings.agent_max_calls} calls. Version ${s.taxonomy_version}.`],
       ['SRS-TAX-03','Criteria and examples',`${carded} of ${live.length} buckets have a verified card: inclusions, exclusions, linked examples.`],
       ['SRS-TAX-04','Test and revise',`${s.sme_decisions_read} SME decisions read back in this run; report testing and the changelog run against any version.`]]
       .map(([id,t,e]) => `<div class="panel req"><div class="hd"><span class="mono">${id}</span><span class="pill s-grounded">Met</span></div><h3>${t}</h3><p class="body" style="margin:0;font-size:13.5px">${esc(e)}</p></div>`).join('')}
  </div>
  <div class="grid2">
    <div class="panel"><header><h3>Where the buckets landed</h3><span class="note">grounded parent · bucket status</span></header>
      <div class="tw"><table><tr><th>Parent</th><th>Buckets</th></tr>
      ${Object.keys(byParent).sort().map(k => `<tr><td>${pc(k)} ${esc(P[k]?.name||'')}</td><td>${byParent[k].map(b => `<a href="#bucket-${b.id}" class="mono" style="margin-right:8px;white-space:nowrap"><span class="dot d-${b.status}" style="display:inline-block;margin-right:4px"></span>${b.id}</a>`).join('')}</td></tr>`).join('')}
      </table></div></div>
    <div class="panel"><header><h3>Reports by CICTT parent</h3><span class="note">select a code to filter every tab · a report can carry several</span></header>
      <div class="bars">${topCodes.map(p => `<div class="brow">${pc(p.code)}<div class="track"><div class="fill" style="width:${100*p.reports/max}%;background:hsl(${hue(p.code)} 60% 52%)"></div></div><span class="num">${p.reports.toLocaleString()}</span></div>`).join('')}</div></div>
  </div>
  ${Object.keys(yr).length ? `<div class="panel"><header><h3>Reports by year</h3><span class="note">${anyFilter() ? 'matching the filters' : 'all reports'} · NTSB events 2008 onward</span></header>${svgBars(Object.keys(yr).sort().map(y => ({l: y, v: yr[y]})), {h: 170, color: 'var(--c3)'})}</div>` : ''}`;
}

/* ---------------------------------------------------------------- buckets */
function firstBucket() { return (D.buckets.find(b => b.status === 'needs_review') || D.buckets[0]).id; }
function renderBuckets() {
  $('section[data-tab="buckets"]').innerHTML = `<div class="bench">
    <div class="rail" aria-label="Taxonomy hierarchy">
      <div class="tools"><div class="chips" id="fchips"></div><span class="note" id="bcount"></span></div>
      <div class="list" id="blist"></div>
    </div>
    <div class="detail" id="bdetail"></div></div>`;
  railList();
}
function railList() {
  if (!$('#blist')) return;
  const groups = {}, shown = D.buckets.filter(bucketOk), c = counts(shown);
  $('#fchips').innerHTML = ['grounded','needs_review','not_grounded','merged'].filter(k => c[k] || GF.status.has(k)).map(k => `<button class="chip" data-sf="${k}" aria-pressed="${GF.status.has(k)}"><span class="dot d-${k}" style="display:inline-block;margin-right:5px"></span>${LABEL[k]} · ${c[k]}</button>`).join('');
  $('#bcount').textContent = `${shown.length} of ${D.buckets.length} buckets · status chips and the filter bar above apply here`;
  shown.forEach(b => { const k = b.status === 'merged' ? '~merged' : (b.parent || 'none'); (groups[k] = groups[k] || []).push(b); });
  const keys = Object.keys(groups).sort();
  $('#blist').innerHTML = keys.length ? keys.map(k => `<div class="grp"><span class="lbl">${k === '~merged' ? 'Merged before grounding' : `${k} · ${esc(P[k]?.name || '')}`}</span><span class="lbl">${groups[k].length}</span></div>` +
    groups[k].map(b => `<button class="item" data-id="${b.id}" aria-current="${b.id === current}" style="border-left:3px solid ${b.parent ? `hsl(${hue(b.parent)} 60% 52%)` : 'transparent'}"><span class="id">${b.id}</span><span class="nm">${esc(b.name)}${fleetActive() && b.status !== 'merged' ? ` <span class="note">· ${fleetSupport(b)} from fleet</span>` : ''}</span><span class="dot d-${b.status}" title="${LABEL[b.status]}"></span></button>`).join('')).join('')
    : '<div class="empty">No bucket matches the filters.</div>';
  $('#blist').onclick = e => { const b = e.target.closest('.item'); if (b) location.hash = 'bucket-' + b.dataset.id; };
}
function checkState(k) { return k.passed ? 'pass' : (k.severity === 'block' ? 'block' : 'review'); }
function citeBtn(c) {
  if (c.cite_type === 'report') return `<button class="cite" data-r="${esc(c.cite_id)}" data-q="${esc(c.quote||'')}">report:${esc(c.cite_id)} ↗</button>`;
  if (c.cite_type === 'sibling' || c.cite_type === 'candidate') return `<a class="cite" href="#bucket-${esc(c.cite_id)}">${c.cite_type}:${esc(c.cite_id)}</a>`;
  if (c.cite_type === 'definition') return `<span class="cite" title="${esc(DEF[c.cite_id]?.text||'')}">definition:${esc(c.cite_id)}</span>`;
  return `<span class="cite" disabled>${esc(c.cite_type)}:${esc(c.cite_id)}</span>`;
}
function repMeta(k) {
  const r = D.reports[k] || {};
  return [r.date, [r.make, r.model].filter(Boolean).join(' '), r.part ? 'Part ' + r.part.replace(/^0+/, '') : ''].filter(Boolean).join(' · ');
}
function showBucket(id, quiet) {
  current = id; if (!quiet) railList();
  const b = B[id]; if (!b) return;
  const el = $('#bdetail');
  if (b.status === 'merged') {
    el.innerHTML = `<div class="panel dhead"><div class="flow"><span class="mono">${b.id}</span>${pill('merged')}</div><h2>${esc(b.name)}</h2>
      <p class="body" style="margin:0">${esc(b.definition)}</p>
      <p style="margin:0">Folded into <a href="#bucket-${b.merged_into}">${b.merged_into} · ${esc(B[b.merged_into]?.name||'')}</a> before grounding. Both discovery batches describe the same events
      (similarity ${b.diag.merge_score ?? '—'}: half definition cosine, half overlap of retrieved reports). An SME can undo it with <span class="code">keep_separate</span>.</p></div>`;
    return;
  }
  const d = b.diag, inc = b.card.filter(c => c.kind === 'include'), exc = b.card.filter(c => c.kind === 'exclude' || c.kind === 'boundary');
  const scores = Object.entries(d.parent_scores || {}), smax = Math.max(...scores.map(x => x[1]), 0.0001);
  const failed = b.checks.filter(k => !k.passed);
  el.innerHTML = `
  <div class="panel dhead">
    <div class="flow"><span class="mono">${b.id}</span>${pill(b.status)}<span class="note">${OUTCOME[b.outcome] || b.outcome}</span>
      ${b.aliases.length ? `<span class="note">· merged with ${b.aliases.map(a => `<a href="#bucket-${a}">${a}</a>`).join(', ')}</span>` : ''}</div>
    <h2>${esc(b.name)}</h2>
    <p class="body" style="margin:0;max-width:75ch">${esc(b.definition)}</p>
    <div class="flow"><span class="note">Proposed by discovery</span>${pc(b.proposed)}<span class="muted">→</span><span class="note">grounded</span>${pc(b.parent)}
      ${b.proposed && b.parent && b.proposed !== b.parent ? '<span class="pill s-needs_review">parent changed</span>' : ''}
      ${failed.length ? `<span class="note">· failed ${failed.map(k => `<b class="c-${checkState(k)}">${k.id}</b>`).join(' ')}</span>` : '<span class="note">· all checks pass</span>'}</div>
  </div>
  <div class="panel">
    <header><h3>Grounding chain</h3><span class="note">every box is a stored record · select a report to read it in full</span></header>
    <div class="chain">
      <div class="col"><span class="lbl">Bucket</span><div class="node dark"><span class="mono" style="color:#f0b357">${b.id}${b.aliases.length ? ' + ' + b.aliases.join(', ') : ''}</span><span class="t">${esc(b.name)}</span><span class="q muted">${esc(b.definition)}</span></div></div>
      <div class="col"><span class="lbl">ICAO parent →</span><div class="node parent" style="border-color:hsl(${hue(b.parent)} 60% 50%)"><span class="mono">${pc(b.parent)}</span><span class="t">${esc(P[b.parent]?.name || '')}</span><span class="q">${esc(P[b.parent]?.definition || '')}</span></div></div>
      <div class="col"><span class="lbl">Industry definitions · ${b.defs.length} →</span>${b.defs.map(x => `<div class="node"><span class="mono">${x}${d.def_scores?.[x] != null ? ` · ${d.def_scores[x].toFixed(2)}` : ''}</span><span class="t">${esc(DEF[x]?.term || 'not found')}</span><span class="q muted">${esc(DEF[x]?.source || '')}</span><span class="q">${esc(DEF[x]?.text || '')}</span></div>`).join('') || '<div class="empty">None</div>'}</div>
      <div class="col"><span class="lbl">Supporting reports · ${b.support.length} events</span><div class="scroll">${b.support.map(s => `<div class="node rep" tabindex="0" data-r="${esc(s.report_key)}" data-q="${esc(s.evidence)}">
          <span class="mono">${esc(s.report_key)} ${(D.reports[s.report_key]?.codes || []).map(pc).join(' ')}${fleetActive() && repRow(s.report_key) && fleetOk(repRow(s.report_key)) ? ' <span class="pill s-grounded">in fleet</span>' : ''}</span>
          <span class="note">${esc(repMeta(s.report_key))}${d.support_chunks?.[s.report_key] ? ` · matched in <span class="chunk ${d.support_chunks[s.report_key]}">${d.support_chunks[s.report_key]}</span>` : ''}</span><span class="q">“${esc(s.evidence)}”</span></div>`).join('') || '<div class="empty">No supporting report passed the cut-off.</div>'}</div></div>
    </div>
  </div>
  <div class="grid2">
    <div class="panel"><header><h3>Parent choice</h3><span class="note">0.3 × definition fit + 0.7 × vote of closest reports</span></header>
      <div class="bars">${scores.map(([k, v], i) => `<div class="brow">${pc(k)}<div class="track"><div class="fill" style="width:${Math.max(0, 100 * v / smax)}%;background:hsl(${hue(k)} 60% ${k === b.parent ? 50 : 70}%)"></div></div><span class="num">${v.toFixed(2)}</span></div>`).join('')}</div>
      <p class="note" style="margin:0">${Math.round(100 * (d.agreement || 0))}% of the closest reports are coded ${esc(b.parent)} · margin ${d.margin?.toFixed(2)} over ${esc(d.runner_up)}${d.co_codes?.length ? ` · suggested co-codes ${d.co_codes.join(', ')}` : ''}</p></div>
    <div class="panel"><header><h3>Checks</h3><span class="note">${b.checks.filter(k => k.passed).length} of ${b.checks.length} pass</span></header>
      <div class="checks">${b.checks.map(k => `<div class="chk"><b>${k.id}</b><span>${esc(k.name)}<br><span class="note">${esc(k.detail)}</span></span><span class="pill s-${k.passed ? 'grounded' : (k.severity === 'block' ? 'not_grounded' : 'needs_review')}">${checkState(k)}</span></div>`).join('')}</div></div>
  </div>
  <div class="panel"><header><h3>Criteria card</h3><span class="note">SRS-TAX-03 · every line carries one citation the verifier resolves (G9)</span></header>
    <div class="grid2">
      <div><div class="lbl" style="margin-bottom:8px">Include when</div><ul class="crit inc">${inc.map(c => `<li><span>${esc(c.text)}</span>${c.quote && c.cite_type === 'report' ? `<blockquote>“${esc(c.quote)}”</blockquote>` : ''}${citeBtn(c)}</li>`).join('')}</ul></div>
      <div><div class="lbl" style="margin-bottom:8px">Exclude when</div><ul class="crit exc">${exc.map(c => `<li><span>${esc(c.text)}</span>${c.quote && c.cite_type === 'report' ? `<blockquote>“${esc(c.quote)}”</blockquote>` : ''}${citeBtn(c)}</li>`).join('') || '<li>None</li>'}</ul></div>
    </div></div>
  <div class="grid2">
    <div class="panel"><header><h3>Closest reports</h3><span class="note">the pool that voted on the parent</span></header>
      <div class="tw"><table><tr><th>Report</th><th>Codes</th><th class="num">Score</th></tr>

/* ---------------------------------------------------------------- manufacturer and aircraft type */
/* NTSB spells one manufacturer many ways (CESSNA, Cessna, CESSNA AIRCRAFT CO). Normalise to one name, then group

const CORP = new Set('INC INCORPORATED CORP CORPORATION CO COMPANY LLC LTD LIMITED GMBH SA AG PLC AIRCRAFT AIRCRAFTS AIRPLANE AIRPLANES ACFT IND INDUSTRIES INDUSTRIE MFG MANUFACTURING HELICOPTER HELICOPTERS AVN AVIATION DESIGN TEXTRON CANADA INTERNATIONAL INTL DIV DIVISION OF THE'.split(' '));

  ['DE HAVILLAND','DEHAVILLAND','DHC'],['GRUMMAN','GRUMMAN AMERICAN'],['DIAMOND'],['AVIAT'],['BOMBARDIER','CANADAIR'],['EMBRAER'],['EUROCOPTER'],['SIKORSKY'],
  ['MD HELICOPTERS','MD HELICOPTER','MCDONNELL DOUGLAS HELICOPTER'],['MCDONNELL DOUGLAS'],['AMERICAN CHAMPION'],['CHAMPION'],['SCHWEIZER'],['HUGHES'],['ENSTROM'],['VANS',"VAN'S"],
  ['AEROSPATIALE'],['SOCATA'],['MAULE'],['AERONCA'],['LUSCOMBE'],['STINSON'],['TAYLORCRAFT'],['BELLANCA'],['ERCOUPE'],['AYRES'],['LANCAIR'],['TECNAM','COSTRUZIONI AERONAUTICHE TECNA'],['FLIGHT DESIGN'],['ZENITH'],['RANS'],['ROCKWELL'],['RAYTHEON'],['NORTH AMERICAN']];

  const w = (m || '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').split(/\s+/).filter(Boolean);
  while (w.length > 1 && w[0] === 'THE') w.shift();
  const raw = w.join(' ');
  while (w.length > 1 && CORP.has(w[w.length - 1])) w.pop();
  const cut = w.join(' ');
  for (const t of [raw, cut]) for (const [k, c, a] of MAKE_KEY) if (t === a || t.startsWith(a + ' ') || t.replace(/ /g, '') === k) return c;
  return cut || 'UNKNOWN';
}

   737-8H4, 737 7H4, 737-800 → 737 · 172S, 172N → 172 · PA-28-161, PA28R → PA28 · R44 II → R44 · EC 130 T2 → EC130 · A320-232 → A320 */

  if (/^B7\d\d/.test(h)) h = h.slice(1);               // B737-800 written with Boeing's B prefix

/* ---------------------------------------------------------------- global filters (every tab) */

const STOP = new Set('a an the and or of to in on at for from by with without is are was were be been it its this that than then as into over under after before during other such any all not no can may per their there which while we our they he she his her them who also had has have did do does about out up down off very just only pilot pilots airplane aircraft flight accident'.split(' '));

function buildIndex() {
  const df = new Map(), docs = corpus.rows.map(r => { const tf = new Map(); toks(r.text + ' ' + r.findings).forEach(w => tf.set(w, (tf.get(w) || 0) + 1)); tf.forEach((_, w) => df.set(w, (df.get(w) || 0) + 1)); return tf; });

    for (const w of qt) { const f = d.get(w); if (f) s += idf(w) * f * 2.2 / (f + 1.2 * (0.25 + 0.75 * len[i] / avg)); }
    if (s > 0) out.push([i, s]); });

     <div class="field"><label for="tfrom">Start from a bucket</label><select id="tfrom"><option value="">Choose…</option>${opts}</select></div>

      <div class="tw"><table><tr><th>Merged</th><th>Into</th><th class="num">Similarity</th></tr>${merged.map(b => `<tr><td><a href="#bucket-${b.id}">${b.id}</a> ${esc(b.name)}</td><td><a href="#bucket-${b.merged_into}">${b.merged_into}</a> ${esc(B[b.merged_into]?.name || '')}</td><td class="num">${b.diag.merge_score ?? '—'}</td></tr>`).join('') || '<tr><td colspan="3" class="note">No merges in this run.</td></tr>'}</table></div></div>
    <div class="panel" id="t-verify"><span class="kicker">10 · Evidence and checks</span><h3>Quotes are exact sentences; ten checks decide</h3>
      <div class="formula">quote = argmax over the report's sentences of 0.5 × cos + 0.5 × keyword overlap      G4: quote ⊂ raw text</div>
      ${svgBars(checkIds.map(id => ({l: id, v: live.filter(b => b.checks.some(k => k.id === id && !k.passed)).length, c: ['G6','G7','G8'].includes(id) ? 'var(--c2)' : 'var(--bad)'})), {h: 190, values: true, label: 'buckets failing each check'})}
      <div class="legend"><span><i style="background:var(--bad)"></i>blocking check (not grounded)</span><span><i style="background:var(--c2)"></i>review check (SME)</span></div></div>
  </div>

  <div class="panel" id="t-history"><span class="kicker">11 · Run history</span><h3>What each technique changed on the real data</h3>
    ${svgHStack(H.map(h => ({label: h.label, parts: ['grounded','needs_review','not_grounded','merged'].map(k => ({v: h.counts[k] || 0, c: COLORS[k], name: LABEL[k]})), tag: `${h.candidates} candidates`})), {left: 300, max: Math.max(...H.map(h => h.candidates), 1) * 1.1, label: 'status counts per run'})}
    <div class="legend">${['grounded','needs_review','not_grounded','merged'].map(k => `<span><i style="background:${COLORS[k]}"></i>${LABEL[k]}</span>`).join('')}</div>
    <div class="tw"><table><tr><th>Run</th><th>Units</th><th>Refill</th>${['grounded','needs_review','not_grounded','merged'].map(k => `<th class="num">${LABEL[k]}</th>`).join('')}</tr>
      ${H.map(h => `<tr><td>${esc(h.label)}<br><span class="mono muted">${esc(h.run)}</span></td><td>${esc(h.units)}</td><td>${h.refill ? 'on' : 'off'}</td>${['grounded','needs_review','not_grounded','merged'].map(k => `<td class="num">${h.counts[k] || 0}</td>`).join('')}</tr>`).join('')}</table></div></div>

  <div class="panel" id="t-all"><span class="kicker">12 · Reference</span><h3>Every technique, where it lives and how to switch it</h3>
    <div class="tw"><table><tr><th>Technique</th><th>What it does</th><th>Setting</th><th>Code</th></tr>
    ${[['Routing by record type','narrative, shorthand, notification, thin and quarantined lanes; relative cut-off per report source','cutoff_scope=source','text.py · ground.relevant'],
       ['Section-aware chunking','summary, findings, ≈1,100-char narrative pieces, each with an event header','units=chunks','store.chunks_for'],
       ['Findings as a chunk','NTSB coded causes and factors verbalized and indexed','(always with chunks)','tools/ingest_ntsb.py'],
       ['LSA embedder','TF-IDF 1–2-grams → SVD-128, unit vectors; deterministic','embedder','embed.LocalEmbedder'],
       ['Dense + lexical channels','1,000 nearest by vector ∪ 1,000 by ts_rank_cd','per_channel','store.reports_chunks'],
       ['Linear hybrid fusion','0.6 × cosine + 0.4 × normalised keyword rank','vector_weight=0.6','store.reports_*'],
       ['Okapi BM25 (option)','lexical scores with k1 1.2, b 0.75 over narrative + findings + codes','lexical=bm25','store.build_bm25'],
       ['Reciprocal rank fusion (option)','RRF k=60 then rerank','retrieval=rrf','store.reports_rrf'],
       ['Relative cut-off','keep ≥ 0.4 × best (≥ 0.15)','relative_cutoff, min_score','ground.relevant'],
       ['Parent scoring','0.3 definition fit + 0.7 vote of the closest reports','parent_def_weight','ground.ground_candidate'],
       ['Closed-set selection','parent, definitions and reports chosen only from retrieved lists','max_definitions, max_reports','ground.ground_candidate'],
       ['Event de-duplication','two aircraft of one event count once','(always)','ground.ground_candidate'],
       ['Sibling rule','a report supports only the sibling it matches best','(always)','ground.resolve_siblings'],
       ['Support refill','fill slots after de-duplication and the sibling rule, from up to 60 relevant reports','support_refill, support_depth','ground.resolve_siblings'],
       ['Cross-batch de-duplication','merge twins before grounding','merge_threshold=0.55','ground.dedupe'],
       ['Evidence sentence','exact sentence, 0.5 cosine + 0.5 keyword','—','store.best_sentence'],
       ['Lost-in-the-middle packing','strongest evidence at both ends of the LLM prompt','selector=llm-*','ground.build_prompt'],
       ['Deterministic verifier','G1–G10 on every output, rules, LLM or agent','min_support, min_parent_agreement, parent_margin','verify.py'],
       ['Bounded agent','≤ 5 tool calls, proposes only','agent_max_calls','agent.py'],
       ['Versioning','output hash, SSSOM rows, changelog causes, release gate','—','pipeline.py · cli.py']]
      .map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td></tr>`).join('')}</table></div></div>`;
  sec.onclick = e => { const g = e.target.closest('[data-goto]'); if (g) { e.preventDefault(); document.getElementById(g.dataset.goto)?.scrollIntoView({behavior: 'smooth', block: 'start'}); } };
}

/* ---------------------------------------------------------------- method */
function renderMethod() {
  const m = D.mapping?.mapping || {};
  const byCode = {}; Object.entries(m).forEach(([k, v]) => { if (v) (byCode[v] = byCode[v] || []).push(k); });
  const stages = [['Prepare','Snapshot and hash the inputs, validate every record, route each report (narrative, shorthand, notification, thin, quarantined), index in pgvector with full text.'],
    ['Remember','Read every active SME decision back from the release store before anything is chosen.'],
    ['Ground','Merge cross-batch twins, then choose the parent, definitions and reports only from closed sets; one report per event; sibling rule.'],
    ['Prove','Build the criteria card, run checks G1–G10, send blocked buckets to a bounded agent that can only propose.'],
    ['Version','Decide each outcome, store SSSOM-style links, write the changelog, release only with SME approval.']];
  $('section[data-tab="method"]').innerHTML = `
   <div class="panel"><header><h2>How grounding works</h2><span class="note">one command: python3 -m taxground run --data data/ntsb --set min_support=10</span></header>
     <div class="grid5">${stages.map(([t, d], i) => `<div class="node" style="${i === 3 ? 'border:2px solid var(--amber-strong)' : ''}"><span class="mono">${i + 1}</span><span class="t">${t}</span><span class="q">${d}</span></div>`).join('')}</div></div>
   <div class="grid2">
     <div class="panel"><h3>The checks</h3><div class="tw"><table><tr><th>Id</th><th>Check</th><th>If it fails</th></tr>
       ${[['G1','Parent is an allowed, in-scope CICTT category','Not grounded'],['G2','Definitions exist and are crosswalked to the parent','Not grounded'],['G3','Reports exist, are coded to the parent and carry evidence','Not grounded'],
          ['G4','Evidence is quoted word for word from the raw text','Not grounded'],['G5',`At least ${D.settings.min_support} distinct supporting events`,'Not grounded'],['G6',`At least ${Math.round(100 * D.settings.min_parent_agreement)}% of the closest reports sit under the parent`,'Needs review'],
          ['G7',`Parent beats the runner-up by at least ${D.settings.parent_margin}`,'Needs review'],['G8','Parent matches discovery’s proposal, or an SME set it','Needs review'],['G9','Criteria card complete; every citation resolves; quotes verbatim','Not grounded'],['G10','SME decisions from the release store are honoured','Not grounded']]
         .map(r => `<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div></div>
     <div class="panel"><h3>The data</h3>
       <p class="body" style="margin:0">${esc(D.note || '')}</p>
       <p class="body" style="margin:0">Retrieval units: ${D.settings.units === 'chunks' ? 'section-aware chunks — a summary (probable cause), a findings chunk (NTSB coded causes and contributing factors, verbalized) and narrative pieces of about 1,100 characters, each carrying the event header; each report takes its best chunk' : 'one vector per report'}. Quotes are exact sentences of the narrative or the findings.</p>
       <p class="body" style="margin:0">Each aircraft record is one report: probable cause plus the analysis narrative, kept raw. Multi-aircraft events share an event id and count once. Level 1 codes come from each record’s NTSB occurrences through a draft mapping (${esc(D.mapping?.version || '')}); impact and post-impact fire count only when they are the defining event.</p>
       <details><summary class="lbl" style="cursor:pointer">NTSB occurrence codes behind each CICTT parent</summary>
         <div class="tw" style="margin-top:8px"><table><tr><th>CICTT</th><th>NTSB occurrence codes</th></tr>${Object.keys(byCode).sort().map(k => `<tr><td><span class="code">${k}</span></td><td class="mono">${byCode[k].join(' ')}</td></tr>`).join('')}</table></div></details>
       <p class="note" style="margin:0">Limits: a stand-in embedder (TF-IDF + SVD) and settings tuned on synthetic samples; the occurrence mapping and the definition crosswalk need SME approval; definitions are paraphrases.</p></div>
   </div>`;
}
})();
