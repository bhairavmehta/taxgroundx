st 28, 2026, about 0145 Pacific daylight time, an IAI 1124A Westwind airplane, Canadian registration C-GIAW, was substantially damaged when it was involved in an accident at Harry Reid International Airport (LAS), Las Vegas, Nevada.","feats":[["las",0.0141],["landing gear",0.0091],["gear",0.0076],["las las",0.0076],["main landing",0.0076]],"date":"","make":"","text":"On August 28, 2026, about 0145 Pacific daylight time, an IAI 1124A Westwind airplane, Canadian registration C-GIAW, was substantially damaged when it was involved in an accident at Harry Reid International Airport (LAS), Las Vegas, Nevada. The two pilots, and three medical crew members were not injured. The airplane was operated by SkyCare Air Ambulance and Charter as a Title 14 Code of Federal Regulations Part 129 air ambulance flight. According to the pilot, during the takeoff roll, the airplane\u2019s left main tire burst when the airplane reached about 130 knots indicated, which was followed by an audible \u201cthud\u201d sound. The airplane then veered left and the pilot retarded the throttle levers, deployed the idle thrust reversers and pushed hard on the brakes and right rudder. In an attempt to regain control of the airplane the pilot released the left brake. However, the airplane exited the left side of the runway and traversed the runway safety area before it came to rest in an adjacent taxiway. The left main landing gear collapsed, and the right tire blew during the accident sequence. The runway surface revealed two parallel tire marks to the left of the runway centerline about midfield that were accompanied by irregular tire signatures and shredded tire material and brake components. The airplane\u2019s lower fuselage sustained substantial damage. The airplane was recovered to the ramp area at LAS for further examination.\n","struct":["PH:Takeoff","L1:SCF-NP"]},{"key":"ERA26LA316","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0068,"set":[],"scores":[["D01",0.0068],["D12" ntral daylight time, an Aviat Aircraft Inc A-1B airplane, N299CA, was substantially damaged when it was involved in an accident near Pilot Grove, Minnesota. The two pilots received minor injuries. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 aerial photography flight. The pilot in the rear seat stated they were conducting an aerial photography flight and had flown for about 5 \u00bd hours that day. During the flight, the front seat pilot was manipulating the flight controls and noted that the airplane was not responding normally. They observed that the left aileron had partially detached from the wing and the outboard end was hanging down. The front seat pilot executed an emergency landing to a field. During the landing, the airplane nosed over and sustained substantial damage to both wings and the empennage. Postaccident examination of the airplane revealed that the left outboard aileron hinge bracket was fractured. The airplane was retained for further examination. A review of NTSB records revealed that the airplane was involved in a similar accident in 2017 involving an inflight failure of the left outboard aileron hinge bracket assembly.\n","struct":["PH:Enroute","L1:SCF-NP"]},{"key":"ERA26LA303","codes":"SCF-PP SCF-NP LOC-G","decision":"none_of_these","primary":"D01","p":0.0176,"set":[],"scores":[["D01",0.0176],["D05",0.0073],["D04",0.0052],["B10",0.0032],["D12",0.0003]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.02: new bucket or widen D01","evidence":"2 miles south-southeast of the airport.","feats":[["L1:LOC-G",0.0482],["L1:SCF-NP",0.0311],["wreckage",0.007],["glide",0.0064],["wreckage following",0.0058]],"date":"","make":"","text":"On August 15, 2026, about 1300 eastern daylight time, an experimental, amateur-built Zenith 601 HDS airplane, N601EZ, was substantially damaged when it was involved in an accident near Ripley Landing, West Virginia. The private pilot was seriously injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. The pilot departed Jackson County Airport, Ravenswood, West Virginia (I18), with the intention of practicing touch and go landings at the airport. The pilot reported that during the left turn onto the downwind leg of the airport traffic pattern, the engine lost all power. The pilot turned the airplane towards the airport but did not have enough altitude to glide to it. The pilot made an emergency off field landing in a tree clearing about 1.2 miles south-southeast of the airport. Upon touchdown, the nose gear impacted terrain, the airplane then nosed over and came to rest inverted. The pilot was trapped under the wreckage until the following day when he was located by first responders about 0900. The wreckage was recovered and retained for further examination.\n","struct":["PH:Approach","L1:SCF-PP","L1:SCF-NP","L1:LOC-G"]},{"key":"CEN26LA290","codes":"UNK","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under UNK: consider a new bucket","evidence":"","feats":[],"date":"","make":"","text":"On August 14, 2026, about 1459 central daylight time, a Gulfstream Aerospace G-IV airplane, N406JS, was substantially damaged when it was involved in an accident near St. Louis, Missouri. The three crew members and 7 passengers were not injured. The airplane was operated as a Title 14 Code of Federal Regulations part 135 on-demand air taxi flight. According to the crew, they received a STEER BY WIRE FAIL Crew Alerting System (CAS) message before departure from Eagle County Regional Airport (EGE), Eagle, Colorado. They completed the appropriate checklist and the message cleared. While on approach to Runway 8R at Spirit of St. Louis Airport (SUS), St. Louis Missouri, after lowering the landing gear, the crew again received a STEER BY WIRE FAIL CAS message. The crew completed the checklist; however, the message did not clear. The airplane landed on the runway and as the nose wheel contacted the runway it began to shimmy. The nose landing gear (NLG) separated from the airplane followed by a collapse of the left main landing gear. The airplane veered left into the grass and came to rest upright. During the accident sequence, the airplane sustained damage to the lower fuselage and left wing. According to the pilot, during the preflight inspection, the airport ground crew was unable to install the pip pin that goes into the NLG torque link that is used to engage and disengage the scissor link with the Nose Wheel Steering actuator for the NLG. The pilot was able to install the NLG pip pin which has a secondary safety pin that is normally installed into the pip pin to help ensure it","struct":["PH:Landing","L1:UNK"]},{"key":"ERA26LA305","codes":"UNK","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under UNK: consider a new bucket","evidence":"","feats":[],"date":"","make":"","text":"On August 14, 2026, about 1040 eastern daylight time, an experimental amateur-built Zenith Cruzer, N673BK, was substantially damaged when it was involved in an accident near Chatham, Massachusetts. The pilot and the pilot-rated passenger received minor injuries. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 flight test. According to the pilot and the owner/builder of the airplane, the accident flight was the airplane\u2019s fourth during its phase one testing. The previous three flights were uneventful except for oil temperature anomalies. The owner/builder had adjusted the oil cooler position and the purpose of the accident flight was to verify whether repositioning the oil cooler improved the engine oil temperature readings. The pilot stated that the accident flight was delayed a short time until wind conditions improved. After observing other aircraft operating in the airport traffic pattern, the pilot and the owner/builder decided to proceed with the flight. The preflight inspection, engine runup, and flight control checks were normal. Shortly after takeoff, the pilot reported that the left wing dipped, followed by the right wing, and that the airplane subsequently rocked laterally from side to side. The pilot announced to the owner/builder there was a problem and decided to land the airplane on the remaining runway. Video surveillance footage from the airport showed that the airplane impacted the runway in a left wing down attitude, after which the main landing gear collapsed and the nosewheel separated from the fuselage. The wreckage was retai","struct":["PH:Takeoff","L1:UNK"]},{"key":"ANC26LA084","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0085,"set":[],"scores":[["D01",0.0085],["D12",0.0009]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"During the autorotation, the pilot applied full throttle and the engine and rotor rpm recovered into the normal operating range.","feats":[["rpm",0.0204],["throttle",0.01],["applied",0.0067],["applied throttle",0.0046],["700 ft",0.0042]],"date":"","make":"","text":"On August 12, 2026, at approximately 2305 eastern daylight time, a Robinson R44 Raven II helicopter, N861MP, was substantially damaged when it was involved in an accident near Anthony, Florida. The pilot and passenger sustained minor injuries. The helicopter was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. According to the pilot he had departed a private residence and had climbed to about 700 ft agl when the helicopter started to shake violently. Shortly thereafter the low rotor rpm warning system came on, the pilot lowered the collective and entered an autorotation. During the autorotation, the pilot applied full throttle and the engine and rotor rpm recovered into the normal operating range. As the pilot initiated a climb the engine lost all power again and the pilot made an emergency landing in a field; the helicopter came to rest on its right side. The helicopter is being relocated to a secure location; a detailed examination of the engine and airframe is pending.\n","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"CEN26LA287","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0071,"set":[],"scores":[["D01",0.0071],["D12",0.0012]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"The pilot received minor injuries.","feats":[["position",0.0058],["trees",0.0045],["air",0.0041],["wingtip",0.004],["airplane left",0.0037]],"date":"","make":"","text":"On August 13, 2026, about 1302 central daylight time, a Mooney M20G airplane, N6916N, sustained substantial damage when it was involved in an accident near Luling, Texas. The pilot received minor injuries. The airplane was operated as a Title 14 Code of Federal Regulations (CFR) Part 91 personal flight. According to ADS-B data, the flight originated from the David Wayne Hooks Memorial Airport (DWH), Houston, Texas, about 1058. The airplane proceeded to the west-southwest toward San Antonio, Texas, for about an hour. About this time, the pilot contacted San Antonio Approach Control and declared an emergency. The pilot informed the air traffic controller that the airplane\u2019s engine had lost power. The controller advised the pilot of an airport 7 miles northeast. The pilot requested a vector to the airport which the controller supplied. The pilot later reported having the airport in-sight before the airplane\u2019s position reports ceased. The pilot reported that he executed a forced landing to a road. He said that during the landing roll, the airplane\u2019s left wingtip contacted vegetation along the side of the road which pulled the airplane to the left. The main landing gear went onto the shoulder of the road and the airplane veered off the road and struck trees. The airplane sustained substantial damage to its left wing.\n","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"CEN26LA285","codes":"UNK","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under UNK: consider a new bucket","evidence":"","feats":[],"date":"","make":"","text":"On August 12, 2026, about 1906 eastern daylight time, a Staudacher ZZ 102 experimental airplane, N134ZZ, was substantially damaged when it was involved in an accident near Vicksburg, Michigan. The airline transport pilot and one passenger were seriously injured. The flight operated under the provisions of Title 14 Code of Federal Regulations Part 91 as a personal flight. Preliminary information provided by law enforcement indicated the airplane departed from Thrall Lake Airport (7MI3), Vicksburg, Michigan, and climbed to about 1,500 ft when it descended and impacted terrain. Both occupants were airlifted to hospitals, and the airplane sustained substantial damage to the fuselage and both wings. According to the FAA aircraft records, the airplane was likely a unique build with only the accident airplane currently registered. The airplane was built in 2007 and purchased by the pilot in October 2021. According to a Barnstormers Facebook listing, dated November 8, 2025, the airplane had 210 hours total time, and the engine had 210 hours since major overhaul. Postaccident examination by FAA inspectors revealed the presence of fuel in both fuel tanks. However, when draining fuel from the fuel tanks, an orange substance was found in the fuel line. The airplane was retained for further examination.\n","struct":["PH:Takeoff","L1:UNK"]},{"key":"WPR26FA301","codes":"UNK","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under UNK: consider a new bucket","evidence":"","feats":[],"date":"","make":"","text":"On August 10, 2026, at about 1835 mountain daylight time, an experimental amateur built Glasair Sportsman 2 Plus 2 airplane, N202AZ, was destroyed when it was involved in an accident near Pine, Arizona. The pilot and passenger were fatally injured. The airplane was operated as Title 14 Code of Federal Regulations Part 91 personal flight. According to preliminary ADS-B data, the airplane departed from runway 06 at Payson Airport (PAN), Payson, Arizona about 1827:07. The airplane flew on a northwest heading, climbing to about 5,850 ft mean sea level (msl) at 1831:51, before turning to the southwest above mountainous terrain about 7 nautical miles (nm) northwest of PAN. The airplane proceeded to the southwest and descended into a canyon, when the ADS-B signal was lost at 1835:47, about an altitude of 4,675 ft msl (about 680 ft above ground level and 136 ft above the canyon rim). The airplane impacted terrain about 3 nm west of the last ADS-B data point, on the northwestern face of a draw at an elevation of about 3,994 ft msl. The accident site area was comprised of roughly 45\u00b0 sloping terrain with desert junipers and prickly pear cacti scattered along the rocky slope. The first identifiable point of impact (FIPOI) was a desert juniper with separated and damaged branches along with the left wing tip located at the base of the tree. The FIPOI was located about 791 ft above the base of the ravine, and about 1,300 ft below the ridgeline. The wreckage debris path was about 102 ft in length and oriented on a magnetic heading of 175\u00b0. The left wing, left aileron, left flap, right win","struct":["PH:Enroute","L1:UNK"]},{"key":"CEN26LA283","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0078,"set":[],"scores":[["D01",0.0078],["D12",0.001]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"He noticed that partial engine power was restored by pulling the mixture control nearly to the idle cutoff position.","feats":[["partial",0.0077],["mixture",0.0057],["propeller",0.0055],["illinois",0.0051],["descent",0.005]],"date":"","make":"","text":"On August 10, 2026, about 1248 central daylight time, an experimental Velocity 173 FG Elite II airplane, N6954K, sustained substantial damage when it was involved in an accident near Palmyra, Illinois. The pilot and two passengers sustained no injuries. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal cross-country flight. According to the pilot, 14 gallons of 100 low lead fuel was purchased prior to the flight at the St. Louis Regional Airport (ALN), East Alton, Illinois. The airplane departed from ALN about 1210, and the destination was the Whiteside County Airport (SQI), Rock Falls, Illinois, where the pilot based the airplane. The airplane climbed to about 7,500 ft msl and established a cruise flight configuration. About 15 minutes later, the engine sustained a total loss of power. The pilot declared an emergency with air traffic control. The pilot coordinated with the controller, and he decided to divert to the nearest airport, the Zelmer Memorial Airpark (5K1), Palmyra, Illinois. During the emergency descent, he attempted to restore the engine power. He noticed that partial engine power was restored by pulling the mixture control nearly to the idle cutoff position. He further noticed that further attempts at a richer setting caused a loss of engine power. The pilot maneuvered the airplane for a straight-in approach to runway 18 at 5K1. He noted that the approach was too high and too fast. During the landing, the airplane departed the runway to the left. The airplane came to rest upright in a flat soybean field. The experimental cana","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"WPR26LA296","codes":"CTOL","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under CTOL: consider a new bucket","evidence":"","feats":[],"date":"","make":"","text":"On August 10, 2026, about 12:55 Pacific daylight time, a Cessna 180, N180DT, was substantially damaged when it was involved in an accident near La Center, Washington. The flight instructor and pilot receiving instruction were seriously injured. The flight was being operated as a Title 14 Code of Federal Regulations Part 91 instructional flight. According to preliminary ADS-B, the airplane departed from runway 31 at Daybreak (WA46), La Center, Washington, about 1250, turned to the northwest, and climbed to 1,025 ft above ground level (agl). At 1251, the airplane made a turn to the east, and continued its climb to 2,200 ft. As the airplane passed the departure end of runway 31, it began a descent and about .5 mile east-southeast of WA46, the airplane made a left turn to the north. 1 mile northeast of WA46, at about 1,200 ft agl, the airplane made a descending 180\u00b0 turn to the left, and flew southbound, approximately parallel with runway 13/31 at WA46, and about .45 mile from runway 13/31. About .40 mile east of the approach end of runway 31, about 250 ft agl, the airplane began a right turn and continued its descent until the end of the available flight track data. The last recorded data point was at 1255, about .23 mile southeast of the approach end of runway 31. (See figure 1) Figure 1. Preliminary ADS-B flight track data of accident flight. According to a witness who was positioned to the east of WA46, he observed the airplane shortly before the accident. He observed the airplane as it made the northbound turn, east of WA46, and then again as it flew southbound and began i","struct":["PH:Approach","L1:CTOL"]},{"key":"ERA26FA294","codes":"LOC-I","decision":"review","primary":"D08","p":0.1595,"set":[["D08",0.1595]],"scores":[["D08",0.1595],["C4",0.0153],["B05",0.0061],["D13",0.0038]],"reason":"only D08 in the set but p = 0.16 < 0.5: SME confirms","evidence":"The accident airplane then entered a steep left bank, followed by a steep descending turn.","feats":[["PH:Maneuvering",0.2978],["steep",0.02],["bank",0.016],["airplane flying",0.0141],["accident airplane",0.0138]],"date":"","make":"","text":"On August 9, 2026, at about 1655 central daylight time, an experimental amateur-built Avid Mark IV, N77FB, was substantially damaged when it was involved in an accident near Arp, Texas. The private pilot was fatally injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. According to witnesses, the accident airplane and a second airplane had landed in a grass field earlier in the afternoon. The accident airplane subsequently departed the field first and remained in the vicinity while the second airplane departed. Witnesses reported that after takeoff, the accident airplane was flying at a low altitude and appeared to be moving slowly as it maneuvered near the second airplane. The accident airplane then entered a steep left bank, followed by a steep descending turn. The airplane subsequently impacted trees and terrain adjacent to the field. The airplane came to rest with all major components located at the accident site. The fuselage sustained impact damage, and both wings remained attached to the fuselage. Examination of the airframe confirmed flight control continuity, and no evidence of preimpact flight control anomaly was observed. Both wing fuel tanks remained intact and contained fuel. Examination of the engine confirmed mechanical continuity and compression on all cylinders. No evidence of a preimpact mechanical anomaly was observed that would have precluded normal operation. An electronic flight instrument was recovered and retained for further examination.\n","struct":["PH:Maneuvering","L1:LOC-I"]},{"key":"ERA26LA295","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.007,"set":[],"scores":[["D01",0.007],["D12",0.0021]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"The pilot stated that he performed an engine run-up, which included a check of the magnetos, propeller governor and auxiliary fuel pump.","feats":[["engine run",0.0081],["run",0.0056],["dense",0.0052],["rough",0.0048],["engine case",0.0044]],"date":"","make":"","text":"On August 9, 2026 at 802 eastern daylight time, a Mooney M20E, N9257V, was substantially damaged when it was involved in an accident near Conway, South Carolina. The pilot was uninjured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. The pilot reported he planned to conduct an instrument flight rules (IFR) cross-country flight from Conway-Horry County Airport (HYW), Conway, South Carolina, to Berkeley County Airport (MKS), Moncks Corner, South Carolina. The pilot stated that he performed an engine run-up, which included a check of the magnetos, propeller governor and auxiliary fuel pump. He then departed runway 22, announced his intention to depart the area on the common traffic advisory frequency and switched to the terminal radar approach control frequency to activate his IFR clearance. Shortly thereafter, he noticed \u201csluggish\u201d performance and decided to switch fuel tanks, which did not resolve the condition. He soon felt a vibration and noticed the engine running rough, which he described as continuing to \u201cpick up and then back off.\u201d About 1,000 ft mean sea level, he turned back to HYW before the engine lost power completely. The pilot stated that he could not reach the airport and soon began striking trees. The airplane came to rest upright, in dense woods. Post accident examination of the airplane by an FAA inspector revealed substantial damage to the empennage, fuselage, and both wings. The fuselage was crumpled and torn in multiple locations, and both the wings and tail sustained significant leading-edge damage. The engin","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"WPR26LA302","codes":"SCF-NP","decision":"none_of_these","primary":"B10","p":0.0051,"set":[],"scores":[["B10",0.0051]],"reason":"no bucket reaches the conformal threshold 0.08; nearest B10 at 0.01: new bucket or widen B10","evidence":"While turning onto the base leg, he extended the wing flaps in preparation for landing and subsequently heard a loud \u201cpop.\u201d","feats":[["extended",0.0174],["preparation landing",0.0095],["assembly",0.0087],["bellcrank",0.0086],["position",0.0072]],"date":"","make":"","text":"On August 9, 2026, at 1420 mountain daylight time, a Cessna 208B airplane, N247JP, was substantially damaged when it was involved in an accident near Salmon, Idaho. The pilot and eight passengers were not injured. The airplane was operated as a Title 14 Code of Federal Regulations (CFR) Part 135 on-demand air taxi flight. The pilot reported that, after an uneventful flight from the departure airport, he joined the downwind leg of the traffic pattern for runway 17. While turning onto the base leg, he extended the wing flaps in preparation for landing and subsequently heard a loud \u201cpop.\u201d Immediately thereafter, the airplane made an aggressive, uncommanded roll to the left and banked to about 45\u00b0. The pilot attempted to regain lateral control by applying right aileron. He moved the control yoke to the full right aileron position and adjusted the aileron trim to the full right setting. The airplane touched down normally, and the pilot taxied it to the ramp without further incident. Following the landing, a company mechanic examined the flight control systems and found substantial damage to the left wing spar. A preliminary examination identified a loose flap bolt that allowed the lower portion of the aft bellcrank to move freely. The aft bellcrank was designed to attach to the airplane with a bolt secured to an anchor nut assembly on its lower surface (see figure 1). The hardware will be retained for further examination. Figure 1: Diagram showing the location of the loose bolt\n","struct":["PH:Approach","L1:SCF-NP"]},{"key":"ANC26FA079","codes":"UNK","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under UNK: consider a new bucket","evidence":"","feats":[],"date":"" e investigation, no preimpact anomalies were visually observed with the flight control ","struct":["PH:Landing","L1:UNK"]},{"key":"CEN26LA268","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0058,"set":[],"scores":[["D01",0.0058],["D12",0.001]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"The private pilot and a passenger were uninjured.","feats":[["approach landing",0.0072],["passenger uninjured",0.006],["airplane hour",0.0057],["airport airplane",0.0051],["northeast",0.0051]],"date":"","make":"","text":"On July 26, 2026, at 1941 central daylight time, an experimental Kitfox III airplane, N573TB, sustained substantial damage when it was involved in an accident near Ephraim, Wisconsin. The private pilot and a passenger were uninjured. The airplane was operated under Title 14 Code of Federal Regulations as a Part 91 personal flight. The pilot stated that he had flown the airplane for about an hour and was returning to Ephriam Airport, Ephraim, Wisconsin. During approach for landing on runway 14, the airplane engine suddenly lost total power. The pilot then performed a forced landing to a field about 3 miles east/northeast of the airport. The airplane sustained substantial damage to both wings. The airplane was retained for further examination.\n","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"CEN26LA269","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0132,"set":[],"scores":[["D01",0.0132],["D12",0.0005]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"Figure 1 \u2013 Airplane at accident site he pilot informed investigators that the airplane was fully fueled before the flight.","feats":[["airplane accident",0.0098],["accident site",0.0087],["july 27",0.0084],["site",0.0075],["50",0.0063]],"date":"","make":"","text":"On July 27, 2026, about 0819 central daylight time, an Aero Commander Callair A-9B airplane, N7799V, was substantially damaged when it was involved in an accident near Livonia, Missouri. The pilot was not injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 137 agricultural application flight. The pilot stated that he was spraying a field at the time of the accident. When the airplane was about 50 feet above ground level, the engine lost power abruptly as it came over a tree line on a final application pass. The pilot conducted a forced landing into the soybean field. The airplane sustained damage to the ailerons, fuselage, empennage and rudder during the forced landing. Figure 1 \u2013 Airplane at accident site he pilot informed investigators that the airplane was fully fueled before the flight. Examinations of the engine and airframe fuel system are planned following recovery of the airplane from the accident site.\n","struct":["PH:Maneuvering","L1:SCF-PP"]},{"key":"CEN26LA284","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0209,"set":[],"scores":[["D01",0.0209],["D12",0.0003]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.02: new bucket or widen D01","evidence":"As the airplane headed toward the runway, the engine began to run rough and the engine RPM decreased.","feats":[["PH:Initial",0.0624],["run",0.0109],["rough engine",0.0107],["run rough",0.0091],["rpm",0.009]],"date":"","make":"","text":"On July 25, 2026, about 1630 central daylight time, a Cessna 150M, N18YZ, was substantially damaged when it was involved in an accident near Ferris, Texas. One pilot sustained minor injuries and the other pilot had no injuries. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. Both pilots reported no abnormalities during the preflight. They added a quart of oil to the engine which was at 3.25 quarts when they checked. They fueled the airplane and taxied to the run-up area where the airplane showed normal indications during the preflight operational checks. The airplane departed from runway 13 at the Lancaster Regional Airport (LNC), Lancaster, Texas. During the initial climb the right seat pilot at the controls observed a climb rate of about 200 feet per minute and recognized the airplane was not producing sufficient performance to safely continue the flight. About 900 ft msl, the pilots agreed that clearing the power lines and trees ahead of them before initiating a turn was their priority. The engine was producing enough power to maintain airplane altitude but the airplane could not climb. After the airplane cleared the power lines and a residential area, the right seat pilot transferred control of the airplane to the left seat pilot and a turn back to the airport was initiated. As the airplane headed toward the runway, the engine began to run rough and the engine RPM decreased. About 3 miles from the airport the engine lost all power. Without enough altitude to glide to runway 31 an emergency landing was performed which resulted","struct":["PH:Initial","L1:SCF-PP"]},{"key":"CEN26FA267","codes":"UNK","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under UNK: consider a new bucket","evidence":"","feats":[],"date":"","make":"","text":"On July 24, 2026, about 1422 central daylight time, a Zenith Zodiac 601HDS experimental airplane, N27601, was destroyed when it was involved in an accident near Sioux City, Iowa. The pilot was fatally injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. The multi-leg visual flight rules (VFR) cross country flight departed from the Wittman Regional Airport (KOSH), Oshkosh, Wisconsin, with a final destination in Colorado. At 1236 on the day of the accident, ADS-B data showed the airplane departed the Pocahontas Municipal Airport (KPOH), Pocahontas, Iowa, on a southwesterly flight track. Upon reaching the vicinity of Holstein, Iowa, the airplane then flew west parallelling U.S. Highway 20 in the direction of Sioux City, Iowa. About 3 miles short of the U.S. Highway 20/75 intersection, the airplane began to track to the northwest, eventually turned north, and began climbing. After flying north, the airplane entered a right turn and descended until the last recorded data point which was located about a half mile southeast of the accident site. The airplane was found in about 6 to 8 feet of water in a man-made lake near the shoreline. The vegetation along the shoreline on the side of the accident site, as well as the bank opposite the accident site about 80 to100 feet away, was intact with no indication of having been struck by the accident airplane. The main wing spar remained intact along its length but from the main landing gear outward on both sides, the wing structure and wing skins showed aft crushing and had mostly separated","struct":["PH:Unknown","L1:UNK"]},{"key":"CEN26LA271","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.007,"set":[],"scores":[["D01",0.007],["D12",0.0017]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"The pilot reported that shortly after takeoff, the engine started to run rough.","feats":[["decrease",0.0143],["run rough",0.0112],["engine started",0.0086],["pressure",0.0086],["run",0.0079]],"date":"","make":"","text":"On July 24, 2026, about 1550 central daylight time, a Beech V35 airplane, N3707Q, was substantially damaged when it was involved in an accident near Carroll, Iowa. The pilot was not injured. The flight was operated under the provisions of Title 14 Code of Federal Regulations Part 91 as a personal flight. According to the pilot, he departed from the Arthur N Neu Airport (CIN), Carroll, Iowa, and flew towards Stanton County Municipal Airport (JHN), Johnson City, Kansas. The pilot reported that shortly after takeoff, the engine started to run rough. He turned back towards CIN and noticed that the oil pressure n an accident near Pell City, Alabama. The flight instructor and student pilot were not injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 instructional flight. According to the instructor they departed St. Clair County Airport (KPLR), Pell City, Alabama, with full fuel tanks for a training flight. About four minutes after departure about 1,500 to 2,000 ft above ground level (agl), the engine lost all power and the instructor performed a forced landing to a field. After landing the airplane continued through a fence and the left wing impacted a tree. According to a Federal Aviation Administration inspector that traveled to the scene the left fuel tank was ruptured. The airplane was recovered and an engine test run was performed. The engine did not run smoothly, and the throttle had to be pumped to keep the engine running. The engine was shut down and secured for further examination.\n","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"CEN26LA260","codes":"OTHR RAMP","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under OTHR, RAMP: consider a new bucket","evidence":"","feats":[],"date":"","make":"","text":"Probable cause: The failure of the pilot to verify the loading hose had been disconnected before taking off and the failure of the loader to disconnect the fuel hose from the helicopter.\nFinding: Personnel issues-Task performance-Use of equip/info-Use of equip/system-Ground crew. Finding: Personnel issues-Task performance-Communication (personnel)-(general)-Ground crew. Finding: Personnel issues-Task performance-Communication (personnel)-(general)-Pilot. Finding: Aircraft-Aircraft handling/service-(general)-(general)-Incorrect use/operation. Finding: Personnel issues-Task performance-Use of equip/info-Use of policy/procedure-Pilot.\n","struct":["PH:Takeoff","L1:OTHR","L1:RAMP"]},{"key":"CEN26LA265","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0183,"set":[],"scores":[  the airplane\u2019s progress on a flight tracking application, saw the airplane stopped transmitting position data partway through the flight. The family member became concerned that the airplane may have crashed and subsequently notified local law enforcement. The FAA issued an Alert Notice (ALNOT) shortly after. The wreckage was located by Search and Rescue personnel the morning of July 10. There are no known witnesses to the accident sequence. Local law enforcement reported that on the night of the accident, the area experienced a significant storm with heavy rain, lightning, strong wind, and low visibility. Recorded ADS-B data showed that at 2226:06, the airplane departed from ALN on a southeast heading and climbed to altitude of about 3,800 ft mean sea level (msl). At 2238:28 the flight track data showed the airplane made a right turn to a southern heading and climbed to an altitude of about 5,000 ft msl. At 2240:54 the airplane made a right turn to a southwest heading and maintained an altitude of about 5,000 ft msl. At 2246:08 the airpla","struct":["PH:Enroute","L1:WSTRW"]},{"key":"WPR26LA256","codes":"F-NI","decision":"none_of_these","primary":"B18","p":0.0025,"set":[],"scores":[["B18",0.0025]],"reason":"no bucket reaches the conformal threshold 0.08; nearest B18 at 0.00: new bucket or widen B18","evidence":"He stated that he performed the emergency procedure and the airplane came to a stop on the runway, at which time both pilots egressed.","feats":[["emergency",0.009],["trailing airplane",0.0084],["warning",0.0068],["continued",0.0064],["trailing",0.0055]],"date":"","make":"","text":"On July 10, 2026, about 1103 Pacific daylight time, a Canadair CF-5D, N845PS, was substantially damaged when it was involved in an accident near Mojave, California. The two pilots onboard were not injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 instructional flight. The pilot reported that during the landing roll the left engine fire warni nd he had been hired to ferry it from Florida to Texas. Prior to the flight, a known mechanical issue existed with the No. 5 cylinder. During the flight, the engine began surging, prompting the pilot to divert to Tallahassee International Airport (TLH), Tallahassee, Florida. While on the approach to TLH, about 1,000 feet mean sea level, all engine power was lost. The airplane subsequently impacted heavily wooded terrain about one-half mile short of Runway 18. According to a Federal Aviation Administration inspector that traveled to the scene, about 14 gallons of fuel were recovered from the wreckage following the accident. The airplane and engine have been recovered and retained for further examination.\n","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"ANC26LA069","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0138,"set":[],"scores":[["D01",0.0138],["D12",0.0008]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"The pilot applied carburetor heat, switched the fuel selector to both and began using different power settings.","feats":[["carburetor heat",0.0368],["carburetor",0.0281],["heat",0.0278],["run",0.0123],["power settings",0.0123]],"date":"","make":"","text":"On July 7, 2026 about 1430 Alaska daylight time, a Piper PA-18-150 airplane, N824JT, was substantially damaged when it was involved in an accident near Mekoryuk, Alaska. The pilot and one passenger were not injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 135, on-demand charter flight. The airplane, owned and operated by Renfro\u2019s Alaskan Adventures, departed from the Mekoryuk airport (MYU) at 1321 to conduct aerial game surveys for the Alaska Department of Fish and Game. About 1 hour and 10 minutes into the flight, about 200 ft. above the ground (agl) the engine began to run rough. The pilot applied carburetor heat, switched the fuel selector to both and began using different power settings. The engine initially began to run normally but subsequently loss partial power. The pilot elected to make a precautionary landing to the tundra, but while on final approach, all engine power was lost. The airplane touched down wings level and a slight nose up pitch. The landing gear separated from the fuselage and the airplane slid to a stop. The airplane sustained substantial damage to the fuselage and wings. A wreckage examination is pending recovery of the wreckage.\n","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"WPR26LA249","codes":"SCF-NP LOC-G","decision":"review","primary":"D05","p":0.3861,"set":[["D05",0.3861]],"scores":[["D05",0.3861],["D04",0.0111],["B10",0.0039]],"reason":"only D05 in the set but p = 0.39 < 0.5: SME confirms","evidence":"After the tailwheel settled onto the runway, the airplane began veering to the right.","feats":[["PH:Landing",0.1417],["brake",0.0603],["tailwheel",0.0536],["L1:LOC-G",0.033],["tailwheel settled",0.0295]],"date":"","make":"","text":"On July 7, 2026, about 1259 mountain daylight time, an Air Tractor, Inc. AT-502B airplane, N647LA, was substantially damaged when it was involved in an accident near Ogden, Utah. The commercial pilot was not injured. The flight was conducted as a Title 14 Code of Federal Regulations Part 137 aerial application flight. The pilot reported that before takeoff, the left brake felt less effective than normal. He performed a brake check and subsequently departed to conduct a mosquito spray operation. During the takeoff roll, the pilot felt an abnormal flutter in the left brake pedal and considered aborting the takeoff. However, given the airplane\u2019s weight, speed and position on the runway, he determined that continuing the takeoff presented less risk than attempting to stop. After departure, he sent a text message to company maintenance personnel advising that he suspected a problem with the left brake and that it would require inspection. Upon returning to the airport he performed a wheel landing, during which the main landing gear contacted the runway before the tailwheel. After the tailwheel settled onto the runway, the airplane began veering to the right. The pilot applied full left rudder, followed by left brake; however, the airplane continued to veer right. He then applied reverse engine thrust to further slow the airplane\u2019s speed. The left main landing gear subsequently collapsed, and the airplane rotated about 180\u00b0 to the right, which resulted in substantial damage to the fuselage, left wing, and left aileron. The airplane then exited the runway and came to rest near the","struct":["PH:Landing","L1:SCF-NP","L1:LOC-G"]},{"key":"WPR26LA251","codes":"SCF-PP ARC","decision":"none_of_these","primary":"D01","p":0.0331,"set":[],"scores":[["D01",0.0331],["D06",0.0201],["D07",0.006],["D15",0.0006],["D12",0.0001]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.03: new bucket or widen D01","evidence":"As the pilot attempted to return to the departure runway, he applied carburetor heat and the engine briefly regained power before experiencing a total loss of power.","feats":[["PH:Initial",0.0516],["L1:ARC",0.0483],["carburetor heat",0.0381],["carburetor",0.0291],["heat",0.0288]],"date":"","make":"","text":"On July 7, 2026, about 1200 Pacific daylight time, a Luscombe 8A, N45886, was substantially damaged when it was involved in an accident near Novato, California. The pilot and passenger were not injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. While conducting touch-and-go takeoff and landings on runway 31 at Gnoss Field (DVO), Novato, California, the engine experienced a partial loss of power during the departure climb about 600 ft above ground level. As the pilot attempted to return to the departure runway, he applied carburetor heat and the engine briefly regained power before experiencing a total loss of power. The pilot then moved the fuel selector from the hreshold 0.08; nearest D05 at 0.06: new bucket or widen D05","evidence":"Initial impact was marked by a ground scar followed by a second ground scar about 3 ft southeast.","feats":[["PH:Landing",0.1529],["L1:LOC-G",0.0356],["ground",0.0227],["landing runway",0.0067],["main",0.0062]],"date":"","make":"","text":"On June 25, 2026, about 2000 central daylight time, an Airborne Windsports Pty Ltd Edge Xt-912-L weight-shift-control light sport aircraft, N912CV was substantially damaged when it was involved in an accident at Winona Municipal Airport (ONA) Winona, Minnesota. The pilot was fatally injured. The aircraft was operated under Title 14 Code of Federal Regulations Part 91 as a personal flight. Before the flight, the pilot removed the Streak 3 king post wing that was on the aircraft for 2 years and installed an Arrow strutted wing. According to his friend, who witnessed the accident, the wing was replaced just before the accident flight, and the purpose of the flight was to test the new wing. The pilot replaced the wing because the strutted wing had a lower height clearance and made it easier to store the aircraft in the hangar. A second friend, who helped with the installation of the wing, said that they made sure that the wing was properly attached before the test flight. According to the friend who witnessed the accident, the pilot performed 2 \u201ccrow hops,\u201d in the aircraft by taking off on runway 30 and immediately landing again on the runway before taking off a third time to fly the traffic pattern. The witness said that the \u201ccrow hops\u201d and traffic pattern were unremarkable until the aircraft turned onto final approach. When the aircraft was on final approach, it looked like the pilot made a small correction and then banked to the left followed by a hard 90\u00b0 bank to the right. The right wingtip impacted the ground first and the aircraft tumbled. The witness said that due to hi","struct":["PH:Landing","L1:LOC-I","L1:LOC-G"]},{"key":"ERA26LA251","codes":"SCF-PP LOC-G","decision":"none_of_these","primary":"D01","p":0.0187,"set":[],"scores":[["D01",0.0187],["D05",0.0118],["D04",0.0033],["D12",0.0002]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.02: new bucket or widen D01","evidence":"The pilot and passenger sustained minor injuries.","feats":[["L1:LOC-G",0.0556],["PH:Initial",0.0539],["cleveland",0.0077],["wreckage",0.0065],["clear",0.0064]],"date":"","make":"","text":"On June 26, 2026, about 1045 eastern daylight time, a Boeing/Jones 75, N3993C, was substantially damaged when it was involved in an accident near Cleveland, Georgia. The pilot and passenger sustained minor injuries. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. The pilot reported that the accident flight was the first flight after an annual inspection was completed on the airplane on May 11, 2026. During the initial climb after takeoff, just above the trees, the climb performance degraded and the airplane could not gain altitude, as if the engine was not developing full power. The pilot then initiated a slow, right turn in an attempt to return to the airport; however, he observed that he did not have enough altitude to clear obstacles back to the airport and elected to perform a forced landing in a cornfield. During the landing, the airplane impacted corn and uneven terrain, which resulted in a hard landing and main landing gear collapse. The airplane then nosed over and came to rest inverted. Initial examination of the wreckage by an FAA inspector revealed substantial damage to the wings, vertical stabilizer, and rudder. The wreckage was retained for further examination.\n","struct":["PH:Initial","L1:SCF-PP","L1:LOC-G"]},{"key":"ERA26LA260","codes":"LOC-G","decision":"none_of_these","primary":"D05","p":0.0241,"set":[],"scores":[["D05",0.0241],["D04",0.0022]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D05 at 0.02: new bucket or widen D05" ding. During the landing rollout, the airplane struck a ditch, which resulted in substantial damage to the right wing and fuselage. The airplane was retained for further examination.\n","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"WPR26LA236","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0073,"set":[],"scores":[["D01",0.0073],["D12",0.0018]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"According to the pilot, about 15 nm northeast of YNK the engine began to run rough, so he enriched the mixture to smooth out the engine.","feats":[["smooth engine",0.0149],["run rough",0.0117],["mixture",0.0094],["run",0.0082],["rough",0.0071]],"date":"","make":"","text":"On June 25, 2026, about 1125 mountain standard time, a Beech S35, N6040F, sustained substantial damage when it was involved in an accident near Dome, Arizona. The pilot and three passengers were not injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. The pilot reported that he departed Eagle Roost Airport (27AZ), Aguila, Arizona, for a cross-country flight to Yuma Marine Corps Air Station/Yuma International Airport (YNK), Yuma, Arizona. According to the pilot, about 15 nm northeast of YNK the engine began to run rough, so he enriched the mixture to smooth out the engine. The pilot then decided to perform a precautionary landing and landed the airplane on a dirt road with the landing gear retracted. Shortly after touchdown, the airplane veered right off the road and came to rest upright in a ditch. Subsequently, the right wing was substantially damaged. The airplane was recovered to a secure facility for further examination.\n","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"CEN26LA236","codes":"ARC","decision":"none_of_these","primary":"D07","p":0.046,"set":[],"scores":[["D07",0.046],["D06",0.0041],["D15",0.0001]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D0 ence":"Upon exiting the Class B airspace, ATC advised the pilot to maintain his own navigation at an appropriate VFR altitude, which the pilot acknowledged and repeated back.","feats":[["impact point",0.0104],["vfr",0.0097],["slope",0.0066],["training",0.0062],["msl",0.0061]],"date":"","make":"","text":"On June 23, 2026, at about 2247 mountain daylight time, a Cessna 172S, N387AF, was destroyed when it was involved in an accident near Willard, Utah. The pilot was fatally injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. The instrument-rated private pilot was conducting a solo night cross-country flight as part of a commercial flight training program. The pilot and his instructor had conducted a dual night cross-country flight following a similar route as the accident flight about 12 days prior. On the evening of the accident flight, a flight instructor reviewed the pilot\u2019s plan and dispatched the airplane. He observed the pilot using Foreflight electronic flight bag (EFB) software to plan his route and obtain an online briefing for the visual flight rules (VFR) solo night cross-country flight from Salt Lake City, Utah (SLC) to Idaho Falls, Idaho (IDA). According to the route the pilot entered in Foreflight, he planned to depart SLC and perform a climbing left turn to an enroute altitude of 8,500 ft mean sea level (msl). The pilot planned to use the Mountain Road VFR transition northbound through SLC Class B airspace, as indicated on the Salt Lake City Terminal Area Chart. The transition procedure required a clearance from air traffic control (ATC) and specified navigating between several charted VFR waypoints over the eastern edge of the city, and along the west edge of the mountain range. Upon completion of the transition, the pilot\u2019s planned route included a left turn to the northwest from the Ogden Canyon VFR waypoint ","struct":["PH:Enroute","L1:CFIT"]},{"key":"WPR26FA233","codes":"OTHR","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under OTHR: consider a new bucket","evidence":"","feats":[],"date":"","make":"","text":"On June 24, 2026, about 1428 Pacific daylight time, a float equipped Cessna 195, N3877V, was substantially damaged when it was involved in an accident near Pasco, Washington. The pilot and passenger were fatally injured. The airplane was operated under Title 14 Code of Federal Regulations as a Part 91 personal flight. Preliminary recordings from the Tri-Cities Airport (PSC) Air Traffic Control Tower (ATCT) indicated that the accident pilot transmitted to the ATCT about 1421, when they were about 15 miles south of PSC and stated that they were a float plane with the intent to land on the Columbia River. The controller stated that landing would be at their own risk and requested that they report when their landing was assured. The pilot responded that they would report when their landing was assured. The controller transmitted PSC\u2019s current wind and altimeter setting to the accident pilot, with no further transmissions received from the pilot. According to multiple witness accounts and videos received, the accident airplane overflew the Ed Hendler Bridge from east to west and crossed the bridge between the north tower and the river\u2019s eastern shoreline. It continued over the river on a westerly heading for about 9 seconds, then abruptly pitched nose down for 1 second before it struck a high tension transmission line, about 1,040 ft west of the bridge. Subsequently, the accident airplane descended vertically into the Columbia River and came to rest in the river inverted, about 100-200 ft from the river\u2019s eastern shoreline. (see Figure 1.) Figure 1. Accident sequence over river.","struct":["PH:Maneuvering","L1:OTHR"]},{"key":"CEN26LA231","codes":"OTHR SCF-NP","decision":"none_of_these","primary":"B10","p":0.0029,"set":[],"scores":[["B10",0.0029]],"reason":"no bucket reaches the conformal ity-Climb capability-Capability exceeded. Finding: Personnel issues-Action/decision-Info processing/decision-Identification/recognition-Pilot. Finding: Aircraft-Aircraft oper/perf/capability-Performance/control parameters-Descent/approach/glide path-Not attained/maintained. Finding: Environmental issues-Physical environment-Terrain-Mountainous/hilly terrain-Contributed to outcome. Finding: Personnel issues-Task performance-Use of equip/info-Aircraft control-Pilot. Finding: Personnel issues-Action/decision-Info processing/decision-Decision making/judgment-Pilot.\n","struct":["PH:Approach","L1:CFIT","L1:RE"]},{"key":"ANC26LA062","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0094,"set":[],"scores":[["D01",0.0094],["D12",0.0013]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"As engine power continued to deteriorate, the engine remained operational but produced only low power.","feats":[["rpm",0.0164],["pitch propeller",0.0098],["procedures",0.0086],["propeller",0.0077],["low power",0.006]],"date":"","make":"","text":"On June 22, 2026, about 1043 Alaska standard time, a turbine-powered Cessna 208B airplane N94AW, was substantially damaged when it was involved in an accident near Wiseman, Alaska. The nine passengers were uninjured, the pilot sustained minor injuries. The airplane was operated as a Title 14 Code of Federal Regulations Part 135, scheduled commuter flight. The pilot reported that, approximately 15 minutes after departing Coldfoot Airport (CXF), Coldfoot, Alaska, en route to Anaktuvuk Pass Airport (AKP), Anaktuvuk, Alaska, he heard a loud whining noise. Concerned about the source of the noise, he elected to return to CXF. Shortly after turning back, the propeller RPM began surging, engine indications appeared normal. The whining noise and RPM surging continued for approximately five minutes; the whining noise then ceased, but the surging persisted. The pilot reported that the surging appeared to stop only after the engine and propeller RPM decreased. As engine power continued to deteriorate, the engine remained operational but produced only low power. The pilot attempted to feather the propeller; initially, it appeared that the propeller was responding, but it failed to fully feather. Unable to maintain altitude, the pilot selected a brush-covered riverbed as a forced-landing site. During the landing roll over the rough and uneven terrain, the nose landing gear collapsed, and the left wing struck the ground. The airplane sustained substantial damage to the left wing and fuselage. Following the forced landing, the pilot attempted to shut down the engine using the emergency eng","struct":["PH:Enroute","L1:SCF-PP"]},{"key":"CEN26LA234","codes":"LOC-I","decision":"review","primary":"D13","p":0.2066,"set":[["D13",0.2066]],"scores":[["D13",0.2066],["D08",0.0447],["C4",0.0094],["B05",0.0043]],"reason":"only D13 in the set but p = 0.21 < 0.5: SME confirms","evidence":"The helicopter sustained substantial damage to the fuselage, tailboom, and tail rotor driveshaft.","feats":[["PH:Maneuvering",0.2082],["helicopter",0.0968],["tail rotor",0.0621],["translational",0.0434],["translational lift",0.0395]],"date":"","make":"","text":"On June 22, 2026, about 1840 central daylight time, a Bell 47G-2 helicopter, N65520, was substantially damaged when it was involved in an accident near Troy, Missouri. The pilot sustained serious injuries. The helicopter was operated as a Title 14 Code of Federal Regulations (CFR) Part 91 personal flight. The pilot reported that the purpose of the flight was to practice hovering and traffic patterns at Troy Airpark (02MO), Troy, Missouri. After completing several traffic patterns to runway 26, he switched directions to depart on runway 8. The pilot stated that during the climb after translational lift, 50 to 75 ft above ground level, the helicopter began an uncommanded left roll. The pilot was unable to stop the left roll with a right cyclic input. The helicopter continued to roll left as it descended into trees. The helicopter came to rest on its right side. A couple of individuals immediately responded to the accident site to assist the pilot from the helicopter. The helicopter sustained substantial damage to the fuselage, tailboom, and tail rotor driveshaft.\n","struct":["PH:Maneuvering","L1:LOC-I"]},{"key":"ANC26LA063","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0067,"set":[],"scores":[["D01",0.0067],["D12",0.0015]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.01: new bucket or widen D01","evidence":"The airplane exited the end of the runway at 60 knots, continued through a fence, trees, and came to rest against a guardrail.","feats":[["nearest",0.0063],["engine restart",0.0058],["fence",0.0057],["instrument panel",0.0049],["nearest airport",0.0048]],"date":"","make":"","text":"On June 21, 2026, about 1132 eastern daylight time, a Cirrus SR22 airplane, N544CD, was substantially damaged when it was involved in an accident near Windom, West Virginia. The pilot was not injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. The pilot reported that he departed Butler County Regional Airport (HAO), in Hamilton, Ohio, about 0645 to return home to Raleigh-Durham International Airport (RDU), Raleigh-Durham, North Carolina. While in cruise flight about 7,000 ft mean sea level (msl) he noticed a 3% reduction in engine power. A few seconds later, while scanning the instrument panel, the engine lost about 50% of its power. He attempted the engine restart procedure to no avail. About 15 to 20 seconds after the first loss of power, the oil pressure light flickered and then the engine and propeller stopped completely. The pilot selected the nearest airport on the GPS to perform a forced landing. He made right turns and circled over Kee Field Airport (I16), Pineville, West Virginia. He overflew ct with the wave, the airplane broke apart and started to sink. The pilot and passenger inflated their life vests and were pulled out of the water a few minutes later by two individuals in a nearby boat. The fuselage was substantially damaged and was partially submerged. The wreckage was recovered and retained for further examination.\n","struct":["PH:Takeoff","L1:ARC"]},{"key":"ERA26LA278","codes":"GCOL","decision":"review","primary":"D16","p":0.0991,"set":[["D16",0.0991]],"scores":[["D16",0.0991]],"reason":"only D16 in the set but p = 0.10 < 0.5: SME confirms","evidence":"Probable cause: The pilot\u2019s distraction during taxi, which resulted in a taxiway excursion.","feats":[["PH:Taxi",0.2545],["taxiway",0.1502],["taxi",0.0366],["taxi resulted",0.0252]],"date":"","make":"","text":"Probable cause: The pilot\u2019s distraction during taxi, which resulted in a taxiway excursion.\nFinding: Personnel issues-Psychological-Attention/monitoring-Attention-Pilot.\n","struct":["PH:Taxi","L1:GCOL"]},{"key":"WPR26FA216","codes":"UNK","decision":"out_of_scope","primary":"","p":null,"set":[],"scores":[],"reason":"no trained bucket under UNK: consider a new bucket","evidence":"","feats":[],"date":"","make":"","text":"On June 11, 2026, at 2103 central daylight time, a Piper PA-36-300, N57846, was substantially damaged when it impacted a rotating beacon tower and terrain near Henderson, Nebraska. The pilot was fatally injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 137 agricultural flight. According to the agricultural application operator, the pilot was performing a mosquito abatement aerial application flight at dusk. Review of security surveillance video footage from a camera located about 421 ft southeast of an unlit tower, showed that the airplane was flying from east to west and collided with the approximately 50 ft tall tower. At the time of the collision, the video showed the airplane was traveling toward the setting sun. Recorded Spidert xt":"On June 6, 2026, about 0940 eastern daylight time, a North American SNJ-5C, N98RJ was substantially damaged when it was involved in an accident near Midland, Virginia. The pilot and passenger were not injured. The airplane was operated as a Title 14 Code of Federal Regulations Part 91 personal flight. The pilot of the airplane departed from Culpeper Regional Airport (CJR), Culpepper, Virginia and joined a formation flight of 4 airplanes in position No. 3 to perform maneuvers for airshow practice. About 0940, while flying at 3,800 ft mean sea level (msl), 4 nautical miles northeast of Warrenton/Fauquier Airport (HWY), Warrenton, Virginia, the pilot reported that the airplane\u2019s propeller separated and impacted the left wing. The pilot executed an emergency power off landing at HWY without further incident. Postaccident examination of the airplane revealed the leading edge of the left wing was substantially damaged from the left landing light to approximately 8 feet outboard of the light. The propeller, and a portion of the crankshaft that also separated from the engine, were not recovered. Ferrous metal debris were present on a magnetic chip detector in the engine, and ferrous and non-ferrous metal debris were present in the propeller oil feed pipe channel and sump. Metal particulate was also found in the oil filter and suction screen. The remaining end of the crankshaft displayed signatures consistent with tortional shear, with the propeller guide channels being slanted. The engine was retained for further examination.\n","struct":["PH:Maneuvering","L1:SCF-NP"]},{"key":"ERA26LA231","codes":"SCF-PP","decision":"none_of_these","primary":"D01","p":0.0212,"set":[],"scores":[["D01",0.0212],["D12",0.0004]],"reason":"no bucket reaches the conformal threshold 0.08; nearest D01 at 0.02: new bucket or widen D01","evidence":"Prior to departure, he performed an engine run-up, and everything was normal.","feats":[["PH:Takeoff",0.0899],["prevent",0.011],["engine run",0.0092],["thought",0.0068],["run",0.0064]],"date":"","make":"","text":"On June 5, 2026, at 1100 eastern daylight time, an experimental amateur-built Sonex airplane, N28YD, was substantially damaged when it was involved in an accident near Jaffrey, New Hampshire. The private pilot was seriously injured. The flight was conducted as a Title 14 Code of Federal Regulations Part 91 personal flight. The pilot, who was also the owner of the airplane said he planned to depart the Jaffrey Airfield Silver Ranch Airport (AFN), Jaffrey, New Hampshire, for a short flight in the local area. After he performed a pre-flight inspection of the airplane, which included checking the fuel for adequate quantity and for contamination, the pilot started the engine and back-taxied to the end of runway 34. Prior to departure, he performed an engine run-up, and everything was normal. During the subsequent takeoff when the airplane reached about 100 ft above the ground, the engine \u201cunexpectedly stopped.\u201d With no runway remaining to land, and buildings in front of him, he attempted to land in a field off to his left. The pilot had no further memory of the accident sequence. A witness, who watched the airplane depart, said that when the airplane reached about 100 ft above the ground, the engine made two \u201cputt, putt, putt\u201d sounds and went silent. He thought the engine started again but only momentarily. The airplane turned left and the witness thought the airplane was going to impact trees. He grabbed a fire extinguisher and responded to the field where the airplane crashed. The witness later observed the fuel selector in the \u201con\u201d position and turned it off to prevent spilla","struct":["PH:Takeoff","L1:SCF-PP"]},{"key":"ERA26LA240","codes":"LOC-I","decision":"none_of_these","primary":"C4","p":0.0033,"set":[],"scores":[["C4",0.0033],["B05",0.0025],["D08",0.0005],["D13",0.0001]],"reason":"no bucket reaches the conformal threshold 0.08; nearest C4 at 0.00: new bucket or wid <script>

const fmt = (v, d = 2) => v == null || v === '' || Number.isNaN(+v) ? '—' : (+v).toFixed(d);

function hist(values, o = {}) {

   <p class="cap">C3 checks the highlighted sentence appears in the report word for word.</p></div>
  <div class="fig"><h3>Calibrated probability for every sibling bucket</h3>${hbars(ex.scores.map(([b, p]) => ({label: `${b} ${(B[b]?.name || '').slice(0, 22)}`, v: p, color: p >= thr ? (b === ex.primary ? 'var(--assign)' : 'var(--review)') : 'var(--oos)', bold: b === ex.primary})), {max: 1, left: 200, line: thr, lineLabel: 'set threshold', label: 'sibling probabilities'})}
   <h3>Why: top feature contributions (coefficient × value)</h3>${ex.feats.length ? hbars(ex.feats.map(([n, c]) => ({label: n.length > 30 ? n.slice(0, 29) + '…' : n, v: c, color: n.startsWith('F:') ? 'var(--warm)' : n.startsWith('PH:') || n.startsWith('L1:') || n.startsWith('CAT:') ? 'var(--none)' : 'var(--accent)'})), {left: 220, label: 'feature contributions'}) : '<p class="note">No positive contributions.</p>'}</div></div></section>`);

const ps = D.predict_summary || {}, faults = D.faults || [];
html.push(`<section class="step" id="checks"><header><span class="num">10 · CHECKS AND FAULT TESTS</span><h2>Five deterministic checks on every row; five injected faults, ${faults.filter(f => f.blocked === 'True' || f.blocked === true).length} blocked</h2></header>
 <div class="g2"><div class="fig"><h3>Checks on ${N(tot)} classifications</h3><div class="tw"><table><tr><th>Id</th><th>Check</th><th class="n">Failures</th></tr>
   ${D.checks.map(c => `<tr><td class="mono">${c.id}</td><td>${esc(c.name)}</td><td class="n">${ps.check_failures === 0 ? '0' : '—'}</td></tr>`).join('')}</table></div>
   <p class="cap">${ps.check_failures === 0 ? 'No row failed any check.' : `${ps.check_failures ?? '—'} check failures recorded in classifications.csv.`}</p></div>
  <div class="fig"><h3>Faults injected into a valid row</h3><div class="tw"><table><tr><th>Fault</th><th>Must fail</th><th>Result</th></tr>
   ${faults.map(f => `<tr><td>${esc(f.test)}</td><td class="mono">${esc(f.check)}</td><td>${(f.blocked === 'True' || f.blocked === true) ? '<span class="pill d-assign">blocked</span>' : '<span class="pill d-review">not blocked</span>'}</td></tr>`).join('')}</table></div>
   <p class="cap">The same pattern as grounding's guardrails: a check is trusted only after it has caught a planted error.</p></div></div></section>`);

const E = D.evaluation;
html.push(`<section class="step" id="eval"><header><span class="num">11 · EVALUATION</span><h2>${E ? `Answer-key evaluation on ${E.metrics.reports} labelled reports` : 'Evaluation waits for gold labels'}</h2>
 <p class="lead">${E ? `Model <span class="code">clf-${esc(E.metrics.model_id)}</span>, gold file <span class="code">${esc(E.metrics.gold_file)}</span>. ${E.metrics.model_id !== D.meta.model_id ? 'This is a separate model trained on the synthetic run, because only the synthetic set has an answer key; the NTSB model above is evaluated once SMEs fill classifier_input/ntsb_gold_labels_TEMPLATE.csv.' : ''}` : 'Fill classifier_input/ntsb_gold_labels_TEMPLATE.csv and run with GOLD=.'}</p></header>
 ${E ? `<div class="kpis">
  <div><span class="l">Top-1 accuracy</span><span class="v">${pct(E.metrics.top1_accuracy)}</span><span class="s">primary = gold, or abstained on NONE</span></div>
  <div><span class="l">Assigned precision</span><span class="v">${pct(E.metrics.assigned_precision)}</span><span class="s">${E.metrics.assigned} assigned</span></div>
  <div><span class="l">Coverage</span><span class="v">${pct(E.metrics.coverage)}</span><span class="s">share assigned</span></div>
  <div><span class="l">Set coverage</span><span class="v">${pct(E.metrics.set_coverage)}</span><span class="s">target ${pct(E.metrics.conformal_target)}</span></div>
  <div><span class="l">Macro-F1</span><span class="v">${fmt(E.metrics.macro_f1)}</span><span class="s">assigned labels</span></div>
  <div><span class="l">ECE</span><span class="v">${fmt(E.metrics.ece, 3)}</span><span class="s">top-1 probability</span></div></div>
 <div class="tw"><table><tr><th>Report</th><th>Codes</th><th>Gold</th><th>Decision</th><th>Primary</th><th class="n">p</th><th>Set</th><th>Result</th></tr>
  ${E.rows.map(r => { const ok = r.gold.length ? r.gold.includes(r.primary) && r.decision === 'assign' : ['none_of_these', 'out_of_scope'].includes(r.decision); const abst = r.decision !== 'assign' && r.gold.length;
    return `<tr><td class="mono">${esc(r.key)}</td><td class="mono">${esc(r.codes)}</td><td class="mono">${esc(r.gold.join(', ') || 'NONE')}</td><td>${pill(r.decision)}</td><td class="mono">${esc(r.primary)}</td><td class="n">${fmt(r.p, 3)}</td><td class="mono">${esc(r.set)}</td><td>${ok ? '<span class="pill d-assign">correct</span>' : abst ? '<span class="pill d-review">abstained</span>' : '<span class="pill d-out_of_scope">wrong</span>'}</td></tr>`; }).join('')}</table></div>` : '<div class="empty">No evaluation embedded.</div>'}
</section>`);

html.push(`<section class="step" id="explorer"><header><span class="num">12 · PREDICTIONS EXPLORER</span><h2>All ${N(tot)} classifications, with evidence and reasons</h2></header>
 <div class="row"><div class="row" id="dfilt">${['all', ...Object.keys(DEC)].map(k => `<button class="btn" data-d="${k}" aria-pressed="${k === 'all'}">${k === 'all' ? 'All' : DEC[k]} · ${k === 'all' ? tot : (dec[k] || 0)}</button>`).join('')}</div>
  <input type="search" id="q" placeholder="Search report, bucket, code or words" aria-label="Search predictions"></div>
 <div class="g2"><div class="tw" style="max-height:620px;overflow:auto"><table id="ptab"></table></div><div class="fig" id="pdetail"><div class="empty">Select a report.</div></div></div></section>`);

html.push(`<section class="step" id="repro"><header><span class="num">13 · PROVENANCE AND LIMITS</span><h2>Rebuild this page from the same files and you get the same model id</h2></header>
 <div class="g2"><div class="fig"><h3>Identity</h3><div class="tw"><table>
  <tr><td>Model</td><td class="mono">clf-${esc(D.meta.model_id)} · built ${esc(D.meta.built)}</td></tr>
  <tr><td>Code</td><td class="mono">taxclassify ${esc(D.meta.version)} · ${esc(D.meta.code_hash)}</td></tr>
  <tr><td>Grounding run</td><td class="mono">${esc(D.meta.run_id)} · ${esc(D.meta.run_hash)}</td></tr>
  <tr><td>Taxonomy</td><td class="mono">${esc(D.meta.taxonomy)}</td></tr>
  ${Object.entries(D.meta.sources).map(([k, v]) => `<tr><td>Source</td><td class="mono">${esc(k.split('/').slice(-3).join('/'))}<br>sha256 ${esc(v.slice(0, 16))}…</td></tr>`).join('')}
  <tr><td>Settings</td><td class="mono">${Object.entries(S).map(([k, v]) => `${k}=${v}`).join(' · ')}</td></tr></table></div>
  <div class="formula">./run_classifier.sh                       # all six steps from classifier_input/
python3 -m taxclassify train --run classifier_input/ntsb_run --exclude classifier_input/ntsb_test_reports.json
python3 -m taxclassify predict --model models/clf-${esc(D.meta.model_id)} --reports classifier_input/ntsb_test_reports.json
python3 -m taxclassify report  --model models/clf-${esc(D.meta.model_id)} --reports … --out classifier_demo.html</div></div>
  <div class="fig"><h3>Limits</h3><div class="tw"><table>
   <tr><td><b>Silver labels</b></td><td>Training labels come from the retrieval that grounded the buckets; out-of-fold scores flatter the model. Only SME gold labels on a true hold-out measure it.</td></tr>
   <tr><td><b>12 positives per bucket</b></td><td>Probabilities are low and most reports abstain. Expect SetFit on an approved embedder to do better once SMEs label ~30 reports per bucket.</td></tr>
   <tr><td><b>PU bias</b></td><td>Sampled negatives include unlabelled true positives.</td></tr>
   <tr><td><b>Conformal target</b></td><td>Coverage ${pct(1 - S.alpha)} holds on exchangeable data with true labels; here it is a target.</td></tr>
   <tr><td><b>Test reports</b></td><td>The ${N(tot)} NTSB reports were held out of classifier training but were in the grounding corpus; set HOLDOUT_FROM in build_all.sh for a fully unseen set.</td></tr>
   <tr><td><b>Stand-in embedder</b></td><td>Features are TF-IDF; DG-2 (approved embedder) and DG-3 (approved LLM) unlock stages 2 and 3.</td></tr></table></div></div></div></section>`);
$('#main').innerHTML = html.join('');

/* ---------- interactive parts */
function bucketDetail(id) {
  const b = B[id];
  const prSeries = [{color: pcol(b.parent), line: true, pts: b.pr.map(([r, p]) => [r, p])}];
  $('#bdetail').innerHTML = `<div class="fig"><h3>${esc(b.id)} · ${esc(b.name)}</h3><p class="cap">${esc(b.definition)}</p>
    ${xy(prSeries, {xlab: 'recall', ylab: 'precision', hline: b.base_rate, hlab: `base rate ${pct(b.base_rate)}`, label: 'precision-recall curve'})}
    <p class="cap">Out-of-fold precision–recall · AP ${fmt(b.ap, 3)} · Brier ${fmt(b.brier, 3)} · ${b.pos} positives / ${b.neg} negatives · Platt a = ${b.platt[0]}, b = ${b.platt[1]}</p></div>
   <div class="fig"><h3>Strongest positive features</h3>${hbars(b.top.map(([n, c, k]) => ({label: n.length > 34 ? n.slice(0, 33) + '…' : n, v: c, color: k === 'text' ? 'var(--accent)' : k === 'finding' ? 'var(--warm)' : 'var(--none)'})), {left: 250, label: 'positive coefficients'})}
    <h3>Strongest negative features</h3>${hbars(b.negf.map(([n, c, k]) => ({label: n.length > 34 ? n.slice(0, 33) + '…' : n, v: -c, color: 'var(--oos)', tag: 'pushes away'})), {left: 250, label: 'negative coefficients (magnitude)'})}
    <div class="legend"><span><i style="background:var(--accent)"></i>text term</span><span><i style="background:var(--warm)"></i>coded finding</span><span><i style="background:var(--none)"></i>phase / code / category</span></div></div>`;
}
$('#bsel').onchange = e => bucketDetail(e.target.value);
bucketDetail($('#bsel').value);

let dsel = 'all', sel = null;
function table() {
  const q = $('#q').value.toLowerCase().trim();
  const rows = P.filter(p => (dsel === 'all' || p.decision === dsel) && (!q || [p.key, p.primary, p.codes, p.text, B[p.primary]?.name].join(' ').toLowerCase().includes(q)));
  $('#ptab').innerHTML = `<tr><th>Report</th><th>Decision</th><th>Primary</th><th class="n">p</th></tr>` + rows.map(p => `<tr class="click${p.key === sel ? ' sel' : ''}" data-k="${esc(p.key)}"><td class="mono">${esc(p.key)}<br><span class="note">${esc(p.codes)}</span></td><td>${pill(p.decision)}</td><td><span class="mono">${esc(p.primary)}</span> <span class="note">${esc((B[p.primary]?.name || '').slice(0, 28))}</span></td><td class="n">${fmt(p.p, 3)}</td></tr>`).join('') + (rows.length ? '' : '<tr><td colspan="4" class="note">No report matches.</td></tr>');
}
function detail(k) {
  sel = k; table();
  const p = P.find(x => x.key === k);
  $('#pdetail').innerHTML = `<h3>${esc(p.key)} ${pill(p.decision)}</h3><p class="cap">${esc(p.date)} · ${esc(p.make)} · codes ${esc(p.codes)}</p>
   <p style="font-size:13.5px">${esc(p.reason || 'Assigned.')}</p>
   ${p.scores.length ? hbars(p.scores.map(([b, v]) => ({label: `${b} ${(B[b]?.name || '').slice(0, 20)}`, v, color: v >= thr ? (b === p.primary ? 'var(--assign)' : 'var(--review)') : 'var(--oos)'})), {max: 1, left: 190, line: thr, lineLabel: 'threshold', label: 'probabilities'}) : '<p class="note">No trained bucket under these codes.</p>'}
   ${p.feats.length ? `<div class="chips">${p.feats.map(([n, c]) => `<span class="chip ${n.startsWith('F:') ? 'finding' : ''}">${esc(n)} +${fmt(c, 3)}</span>`).join('')}</div>` : ''}
   <div class="report">${hl(p.text, p.evidence)}</div>`;
}
$('#dfilt').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; dsel = b.dataset.d; document.querySelectorAll('#dfilt .btn').forEach(x => x.setAttribute('aria-pressed', x === b)); table(); };
$('#q').oninput = table;
$('#ptab').onclick = e => { const r = e.target.closest('[data-k]'); if (r) detail(r.dataset.k); };
table(); detail(ex.key);

/* rail highlight */
const links = [...document.querySelectorAll('#rail a')];
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.id === en.target.id)); }), {rootMargin: '-30% 0px -60% 0px'});
document.querySelectorAll('section.step').forEach(s => io.observe(s));
})();
</script>

</body></html>
